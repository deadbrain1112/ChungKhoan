spring.application.name=Chung_Khoan
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=QUANLYGIAODICHCHUNGKHOAN;encrypt=false;trustServerCertificate=true;charset=UTF-8

spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
# Các khung gi? phiên giao d?ch
# Gi? m? phiên ATO
trading-time.ato-start=08:45
# Gi? m? phiên ATO
trading-time.ato-end=09:00
# Gi? k?t thúc phiên LO
trading-time.lo-end=22:30
# Gi? k?t thúc phiên ATC
trading-time.atc-end=23:45

# Th?i ?i?m x? lý kh?p l?nh ATO/ATC (sau 1 phút k?t thúc phiên)
trading-time.cron-ato-check=0 47 15 * * MON-SUN
trading-time.cron-atc-check=0 46 19 * * MON-SUN
