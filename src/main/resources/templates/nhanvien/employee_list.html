<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/investor_list.css}">
    <title>Cập nhật nhân viên</title>
</head>
<body>
<div>
    <!-- Toolbar -->
    <div class="toolbar">
        <button type="button" class="toolbar-btn" onclick="showAddForm()">Thêm</button>
        <span class="separator">|</span>
        <form th:action="@{/employees/reload}" method="get" style="display:inline;">
            <button type="submit" class="toolbar-btn">Reload</button>
        </form>
        <span class="separator">|</span>
        <form th:action="@{/employees/save-all}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn" th:disabled="${temporaryEmployees.isEmpty()}">Ghi tất cả</button>
        </form>
        <span class="separator">|</span>
        <form th:action="@{/employees/search}" method="post" style="display:inline;">
            <input type="text" name="query" placeholder="Tìm kiếm..." />
            <button type="submit" class="toolbar-btn">Tìm</button>
        </form>
        <span class="separator">|</span>
        <form th:action="@{/employees/undo}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn" th:disabled="${!canUndo}">Hoàn tác</button>
        </form>
        <span class="separator">|</span>
        <form th:action="@{/employees/clear-undo}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn btn btn-danger">Thoát</button>
        </form>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" th:class="'alert ' + (${messageType}=='success'?'alert-success':'alert-danger')" role="alert">
        <span th:text="${message}"></span>
    </div>

    <!-- Bảng danh sách -->
    <table class="table">
        <thead>
        <tr>
            <th>Mã</th>
            <th>Họ tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Số điện thoại</th>
            <th>CMND</th>
            <th>Giới tính</th>
            <th>Email</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <!-- Duyệt qua employees.content -->
        <tr th:each="employee : ${employees.content}"
            th:classappend="${temporaryMaNVList.contains(employee.maNV)} ? 'unsaved'">
            <td th:text="${employee.maNV}"></td>
            <td th:text="${employee.hoTen}"></td>
            <td th:text="${employee.ngaySinh}"></td>
            <td th:text="${employee.diaChi}"></td>
            <td th:text="${employee.phone}"></td>
            <td th:text="${employee.cmnd}"></td>
            <td th:text="${employee.gioiTinh}"></td>
            <td th:text="${employee.email}"></td>
            <td>
                <!-- Nếu nhân viên đã bị xóa: chỉ hiển thị nút "Hoàn tác xóa" -->
                <form th:if="${employee.daXoa}" th:action="@{/employees/undo-delete}" method="post" style="display:inline;">
                    <input type="hidden" name="maNV" th:value="${employee.maNV}" />
                    <button type="submit" class="toolbar-btn">Hoàn tác xóa</button>
                </form>

                <!-- Nếu chưa bị xóa: hiển thị Sửa và Xóa -->
                <div th:if="${!employee.daXoa}">
                    <button type="button" class="edit-link"
                            th:attr="data-maNV=${employee.maNV},
                         data-hoTen=${employee.hoTen},
                         data-ngaySinh=${employee.ngaySinh},
                         data-diaChi=${employee.diaChi},
                         data-phone=${employee.phone},
                         data-cmnd=${employee.cmnd},
                         data-gioiTinh=${employee.gioiTinh},
                         data-email=${employee.email}">Sửa</button> |

                    <!-- Nếu là nhân viên tạm thời -->
                    <form th:if="${temporaryMaNVList.contains(employee.maNV)}"
                          th:action="@{/employees/remove-temp}" method="post" style="display:inline;">
                        <input type="hidden" name="maNV" th:value="${employee.maNV}" />
                        <button type="submit" class="delete-btn" onclick="return confirm('Xóa khỏi danh sách tạm?')">Xóa</button>
                    </form>

                    <!-- Nếu là nhân viên trong DB -->
                    <form th:unless="${temporaryMaNVList.contains(employee.maNV)}"
                          th:action="@{/employees/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="maNV" th:value="${employee.maNV}" />
                        <button type="submit" class="delete-btn" onclick="return confirm('Xóa khỏi hệ thống?')">Xóa</button>
                    </form>
                </div>
            </td>

        </tr>

        <!-- Nếu không có bản ghi -->
        <tr th:if="${employees.empty}">
            <td colspan="9" style="text-align:center;">Không có dữ liệu nhân viên.</td>
        </tr>
        </tbody>
    </table>

    <!-- Phân trang -->
    <div class="pagination">
        <span th:if="${employees.hasPrevious()}">
            <a th:href="@{/employees(page=${employees.number-1},size=${employees.size})}">« Trước</a>
        </span>
        <span th:each="i : ${#numbers.sequence(0, employees.totalPages-1)}">
            <a th:href="@{/employees(page=${i},size=${employees.size})}"
               th:text="${i+1}"
               th:classappend="${i==employees.number} ? 'active'">
            </a>
        </span>
        <span th:if="${employees.hasNext()}">
            <a th:href="@{/employees(page=${employees.number+1},size=${employees.size})}">Sau »</a>
        </span>
    </div>

    <!-- Form Thêm -->
    <div id="add-form" class="subform-container" style="display:none;">
        <h3>Thêm nhân viên</h3>
        <form th:action="@{/employees/add-temp(page=${employees.number},size=${employees.size})}" method="post">
            <input type="hidden" name="page" th:value="${employees.number}"/>
            <input type="hidden" name="size" th:value="${employees.size}"/>
            <label>Mã nhân viên: <input type="text" name="maNV" maxlength="20" required/></label><br/>
            <label>Họ tên: <input type="text" name="hoTen" maxlength="50" required/></label><br/>
            <label>Ngày sinh: <input type="date" name="ngaySinh" required/></label><br/>
            <label>Địa chỉ: <input type="text" name="diaChi" maxlength="100" required/></label><br/>
            <label>Số điện thoại: <input type="text" name="phone" maxlength="15" required/></label><br/>
            <label>CMND: <input type="text" name="cmnd" maxlength="10" required/></label><br/>
            <label>Giới tính:
                <input type="radio" name="gioiTinh" value="Nam" id="add-nam" required/>
                <label for="add-nam">Nam</label>
                <input type="radio" name="gioiTinh" value="Nữ" id="add-nu" style="margin-left: 20px;"/>
                <label for="add-nu">Nữ</label>
            </label><br/>
            <label>Email: <input type="email" name="email" maxlength="50" required/></label><br/>
            <button type="submit">Lưu vào tạm</button>
            <button type="button" onclick="hideSubform('add-form')">Hủy</button>
        </form>
    </div>

    <!-- Form Sửa -->
    <div id="edit-form" class="subform-container" style="display:none;">
        <h3>Sửa nhân viên</h3>
        <form th:action="@{/employees/edit-temp}" method="post" id="editForm">
            <input type="hidden" name="maNV" id="editMaNV" />
            <label>Mã nhân viên: <span id="editMaNVDisplay"></span></label><br/>
            <label>Họ tên: <input type="text" name="hoTen" maxlength="50" required/></label><br/>
            <label>Ngày sinh: <input type="date" name="ngaySinh" required/></label><br/>
            <label>Địa chỉ: <input type="text" name="diaChi" maxlength="100" required/></label><br/>
            <label>Số điện thoại: <input type="text" name="phone" maxlength="15" required/></label><br/>
            <label>CMND: <input type="text" name="cmnd" maxlength="10" required/></label><br/>
            <label>Giới tính:
                <input type="radio" name="gioiTinh" value="Nam" id="edit-nam" required/>
                <label for="edit-nam">Nam</label>
                <input type="radio" name="gioiTinh" value="Nữ" id="edit-nu" style="margin-left: 20px;"/>
                <label for="edit-nu">Nữ</label>
            </label><br/>
            <label>Email: <input type="email" name="email" maxlength="50" required/></label><br/>
            <button type="submit">Lưu thay đổi</button>
            <button type="button" onclick="hideSubform('edit-form')">Hủy</button>
        </form>
    </div>
</div>

<!-- Script -->
<script src="/js/validate.js"></script>

<script>
    function disableToolbarButtons() {
        document.querySelectorAll('.toolbar-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.edit-link').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);
    }

    function enableToolbarButtons() {
        document.querySelectorAll('.toolbar-btn').forEach(btn => btn.disabled = false);
        document.querySelectorAll('.edit-link').forEach(btn => btn.disabled = false);
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
    }

    function showAddForm() {
        document.getElementById('add-form').style.display = 'block';
        document.getElementById('edit-form').style.display = 'none';
        document.querySelector('#add-form form').reset();
        disableToolbarButtons();
    }

    function showEditForm(data) {
        const form = document.querySelector('#editForm');
        form.querySelector('#editMaNV').value = data.maNV || '';
        form.querySelector('#editMaNVDisplay').textContent = data.maNV || 'Không có';
        form.querySelector('input[name="hoTen"]').value = data.hoTen || '';
        form.querySelector('input[name="ngaySinh"]').value = data.ngaySinh || '';
        form.querySelector('input[name="diaChi"]').value = data.diaChi || '';
        form.querySelector('input[name="phone"]').value = data.phone || '';
        form.querySelector('input[name="cmnd"]').value = data.cmnd || '';
        form.querySelector('input[name="email"]').value = data.email || '';
        const gioiTinhValue = data.gioiTinh?.trim().toLowerCase();
        const gioiTinhNam = form.querySelector('input[type="radio"][name="gioiTinh"][value="Nam"]');
        const gioiTinhNu = form.querySelector('input[type="radio"][name="gioiTinh"][value="Nữ"]');

        if (gioiTinhValue === 'nam' && gioiTinhNam) {
            gioiTinhNam.checked = true;
        } else if (gioiTinhValue === 'nữ' && gioiTinhNu) {
            gioiTinhNu.checked = true;
        }
        document.getElementById('edit-form').style.display = 'block';
        document.getElementById('add-form').style.display = 'none';
        disableToolbarButtons();
    }

    function hideSubform(id) {
        document.getElementById(id).style.display = 'none';
        enableToolbarButtons();
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".edit-link").forEach(link => {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const maNV = this.getAttribute("data-maNV");
                const hoTen = this.getAttribute("data-hoTen");
                const ngaySinh = this.getAttribute("data-ngaySinh");
                const diaChi = this.getAttribute("data-diaChi");
                const phone = this.getAttribute("data-phone");
                const cmnd = this.getAttribute("data-cmnd");
                const gioiTinh = this.getAttribute("data-gioiTinh");
                const email = this.getAttribute("data-email");
                showEditForm({ maNV, hoTen, ngaySinh, diaChi, phone, cmnd, gioiTinh, email });
            });
        });

        // Kiểm tra ngày sinh trong form thêm
        document.querySelector('#add-form form').addEventListener('submit', function(e) {
            const ngaySinhInput = document.querySelector('#add-form input[name="ngaySinh"]').value;
            const ngaySinh = new Date(ngaySinhInput);
            const today = new Date();
            const minYear = 1900;

            if (ngaySinh > today || ngaySinh.getFullYear() < minYear) {
                alert('Ngày sinh không hợp lệ! Vui lòng chọn ngày sinh từ năm 1900 đến nay.');
                e.preventDefault();
            }
        });

        // Kiểm tra ngày sinh trong form sửa
        document.querySelector('#editForm').addEventListener('submit', function(e) {
            const ngaySinhInput = document.querySelector('#edit-form input[name="ngaySinh"]').value;
            const ngaySinh = new Date(ngaySinhInput);
            const today = new Date();
            const minYear = 1900;

            if (ngaySinh > today || ngaySinh.getFullYear() < minYear) {
                alert('Ngày sinh không hợp lệ! Vui lòng chọn ngày sinh từ năm 1900 đến nay.');
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
