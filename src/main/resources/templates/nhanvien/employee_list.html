<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/investor_list.css}">
    <title>Cập nhật nhân viên</title>
</head>
<body>
<div>
    <div class="toolbar">
        <a href="#" onclick="showSubform('add')">Thêm</a>
        <a th:href="@{/employees}">Reload</a> 
        <form th:action="@{/employees/undo}" method="post" style="display:inline;">
			<button type="submit" th:disabled="${!canUndo}">Hoàn tác</button>
		</form>
        <form th:action="@{/employees/clear-undo}" method="post" style="display:inline;">
		    <button type="submit" class="btn btn-danger">Thoát</button>
		</form>
    </div>
    
    <!-- Thông báo hoàn tác -->
	<div th:if="${message}" th:class="'alert ' + (${messageType} == 'success' ? 'alert-success' : 'alert-danger')"
		 role="alert" style="color: red;">
		<span th:text="${message}"></span>
	</div>

    <table class="main-table">
        <thead>
            <tr>
                <th>Mã</th>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Địa chỉ</th>
                <th>Số điện thoại</th>
                <th>CMND</th>
                <th>Giới tính</th>
                <th>Email</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="9" style="text-align: center;" th:text="${noDataMessage}"></td>
            </tr>
            <tr th:each="employee : ${employees}">
                <td th:text="${employee.maNV}"></td>
                <td th:text="${employee.hoTen}"></td>
                <td th:text="${employee.ngaySinh}"></td>
                <td th:text="${employee.diaChi}"></td>
                <td th:text="${employee.phone}"></td>
                <td th:text="${employee.cmnd}"></td>
                <td th:text="${employee.gioiTinh}"></td>
                <td th:text="${employee.email}"></td>
                <td>
				    <a href="#" class="edit-link"
				       th:attr="data-maNV=${employee.maNV},
				                data-hoTen=${employee.hoTen},
				                data-ngaySinh=${employee.ngaySinh},
				                data-diaChi=${employee.diaChi},
				                data-phone=${employee.phone},
				                data-cmnd=${employee.cmnd},
				                data-gioiTinh=${employee.gioiTinh},
				                data-email=${employee.email}">Sửa</a> |
				     <a>Ghi</a> |           
				     <form th:action="@{/employees/delete}" method="post" style="display:inline;">
					    <input type="hidden" name="maNV" th:value="${employee.maNV}" />
					    <button type="submit" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
					</form>
				</td>          
            </tr>
        </tbody>
    </table>

    <div id="subform" class="subform-container">
        <h3 id="subform-title"></h3>
        <form id="employee-form" th:action="@{/employees/add}" th:object="${employee}" method="post">
            <table class="subform-table">
                <tr id="row-maNV">
                    <td><label>Mã nhân viên:</label></td>
                    <td><input type="text" th:field="*{maNV}" id="maNV" maxlength="20" required /></td>
                </tr>
                <tr>
                    <td><label>Họ tên:</label></td>
                    <td><input type="text" th:field="*{hoTen}" maxlength="50" required /></td>
                </tr>
                <tr>
                    <td><label>Ngày sinh:</label></td>
                    <td><input type="date" th:field="*{ngaySinh}" required /></td>
                </tr>
                <tr>
                    <td><label>Địa chỉ:</label></td>
                    <td><input type="text" th:field="*{diaChi}" maxlength="100" required /></td>
                </tr>
                <tr>
                    <td><label>Số điện thoại:</label></td>
                    <td><input type="text" th:field="*{phone}" maxlength="15" required /></td>
                </tr>
                <tr>
                    <td><label>CMND:</label></td>
                    <td><input type="text" th:field="*{cmnd}" id="cmnd" maxlength="10" required /></td>
                </tr>
                <tr>
                    <td><label>Giới tính:</label></td>
                    <td>
                        <input type="radio" th:field="*{gioiTinh}" value="Nam" id="nam" />
                        <label for="nam">Nam</label>
                        <input type="radio" th:field="*{gioiTinh}" value="Nữ" id="nu" style="margin-left: 20px;" />
                        <label for="nu">Nữ</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" th:field="*{email}" maxlength="50" required /></td>
                </tr>
            </table>

            <div class="form-actions">
                <button type="submit">Lưu</button>
                <button type="button" onclick="hideSubform()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
	console.log("Trang đã tải xong, sẵn sàng xử lý sự kiện.");

	document.querySelectorAll(".edit-link").forEach(function (link) {
		link.addEventListener("click", function (e) {
			e.preventDefault();
			const maNV = this.getAttribute("data-maNV");
			console.log("Nhấn 'Sửa', Mã NV được chọn:", maNV);
			showSubform('edit', maNV);
		});
	});

	document.getElementById("employee-form").addEventListener("submit", function (e) {
		const maNV = document.getElementById("maNV").value;
		console.log("Biểu mẫu được gửi, Mã NV (input):", maNV);
		console.log("Action của form:", this.action);
	});
});

function showSubform(action, maNV = '') {
	const subform = document.getElementById('subform');
	const title = document.getElementById('subform-title');
	const form = document.getElementById('employee-form');
	const maNVInput = document.getElementById('maNV');
	const rowMaNV = document.getElementById('row-maNV');

	subform.classList.add('active');
	form.reset();

	if (action === 'add') {
		title.textContent = 'Thêm nhân viên';
		form.action = '/employees/add';
		maNVInput.readOnly = true;
		maNVInput.value = '';
		rowMaNV.style.display = 'none';
	} else if (action === 'edit') {
		title.textContent = 'Sửa nhân viên';
		form.action = '/employees/edit';
		maNVInput.readOnly = true;
		maNVInput.value = maNV;
		rowMaNV.style.display = '';

		const editLink = document.querySelector(`.edit-link[data-maNV="${maNV}"]`);

		form.querySelector('[name="hoTen"]').value = editLink.dataset.hoten;
		form.querySelector('[name="ngaySinh"]').value = editLink.dataset.ngaysinh;
		form.querySelector('[name="diaChi"]').value = editLink.dataset.diachi;
		form.querySelector('[name="phone"]').value = editLink.dataset.phone;
		form.querySelector('[name="cmnd"]').value = editLink.dataset.cmnd;
		form.querySelector('[name="email"]').value = editLink.dataset.email;

		const gioiTinhValue = editLink.dataset.gioitinh?.trim().toLowerCase();
		const gioiTinhNam = form.querySelector('input[type="radio"][name="gioiTinh"][value="Nam"]');
		const gioiTinhNu = form.querySelector('input[type="radio"][name="gioiTinh"][value="Nữ"]');

		if (gioiTinhValue === 'nam' && gioiTinhNam) {
			gioiTinhNam.checked = true;
		} else if (gioiTinhValue === 'nữ' && gioiTinhNu) {
			gioiTinhNu.checked = true;
		}
	}
}

function hideSubform() {
	document.getElementById('subform').classList.remove('active');
}
</script>

</body>
</html>
