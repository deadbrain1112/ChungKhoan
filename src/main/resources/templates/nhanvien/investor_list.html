<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/investor_list.css}">
    <title>Cập nhật nhà đầu tư</title>
</head>
<body>
<div>
    <!-- Toolbar -->
    <div class="toolbar">
        <button type="button" onclick="showSubform('add')" style="display:inline;">Thêm</button> |
        <button type="button" style="display:inline;">Reload</button> |
        <form  method="post" style="display:inline;">
            <button type="submit" >Ghi tất cả</button>
        </form> |
        <form th:action="@{/investors/undo}" method="post" style="display:inline;">
            <button type="submit" th:disabled="${!canUndo}">Hoàn tác</button>
        </form> |
        <form th:action="@{/investors/clear-undo}" method="post" style="display:inline;">
            <button type="submit" class="btn btn-danger">Thoát</button>
        </form>
    </div>

    <!-- Thông báo hoàn tác -->
    <div th:if="${message}" th:class="'alert ' + (${messageType} == 'success' ? 'alert-success' : 'alert-danger')"
         role="alert" style="color: red;">
        <span th:text="${message}"></span>
    </div>

    <!-- Bảng dữ liệu -->
    <table class="main-table">
        <thead>
        <tr>
            <th>Mã</th>
            <th>Họ tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Số điện thoại</th>
            <th>CMND</th>
            <th>Giới tính</th>
            <th>Email</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <!-- If no data -->
        <tr th:if="${#lists.isEmpty(investors)}">
            <td colspan="9" style="text-align: center;" th:text="${noDataMessage}"></td>
        </tr>
        <!-- If data available -->
        <tr th:each="investor : ${investors}">
            <td th:text="${investor.maNDT}"></td>
            <td th:text="${investor.hoTen}"></td>
            <td th:text="${investor.ngaySinh}"></td>
            <td th:text="${investor.diaChi}"></td>
            <td th:text="${investor.phone}"></td>
            <td th:text="${investor.cmnd}"></td>
            <td th:text="${investor.gioiTinh}"></td>
            <td th:text="${investor.email}"></td>
            <td>
                <button type="button" class="edit-link"
                        th:attr="data-maNDT=${investor.maNDT},
                                 data-hoTen=${investor.hoTen},
                                 data-ngaySinh=${investor.ngaySinh},
                                 data-diaChi=${investor.diaChi},
                                 data-phone=${investor.phone},
                                 data-cmnd=${investor.cmnd},
                                 data-gioiTinh=${investor.gioiTinh},
                                 data-email=${investor.email}">Sửa</button> |
                <form th:action="@{/investors/delete}" method="post" style="display: inline;">
                    <input type="hidden" name="maNDT" th:value="${investor.maNDT}" />
                    <button type="submit" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Form Thêm/Sửa -->
    <div id="subform" class="subform-container" style="display:none;">
        <h3 id="subform-title"></h3>
        <form id="investor-form" th:action="@{/investors/add}" th:object="${investor}" method="post">
            <table class="subform-table">
                <tr id="row-maNDT">
                    <td><label>Mã nhà đầu tư:</label></td>
                    <td><input type="text" th:field="*{maNDT}" id="maNDT" maxlength="20" required /></td>
                </tr>
                <tr>
                    <td><label>Họ tên:</label></td>
                    <td><input type="text" th:field="*{hoTen}" maxlength="50" required /></td>
                </tr>
                <tr>
                    <td><label>Ngày sinh:</label></td>
                    <td><input type="date" th:field="*{ngaySinh}" required /></td>
                </tr>
                <tr>
                    <td><label>Địa chỉ:</label></td>
                    <td><input type="text" th:field="*{diaChi}" maxlength="100" required /></td>
                </tr>
                <tr>
                    <td><label>Số điện thoại:</label></td>
                    <td><input type="text" th:field="*{phone}" maxlength="15" required /></td>
                </tr>
                <tr>
                    <td><label>CMND:</label></td>
                    <td><input type="text" th:field="*{cmnd}" id="cmnd" maxlength="10" required /></td>
                </tr>
                <tr>
                    <td><label>Giới tính:</label></td>
                    <td>
                        <input type="radio" th:field="*{gioiTinh}" value="Nam" id="nam" />
                        <label for="nam">Nam</label>
                        <input type="radio" th:field="*{gioiTinh}" value="Nữ" id="nu" style="margin-left: 20px;" />
                        <label for="nu">Nữ</label>
                    </td>
                </tr>
                <tr>
                    <td><label>Email:</label></td>
                    <td><input type="email" th:field="*{email}" maxlength="50" required /></td>
                </tr>
            </table>

            <h4>Tài khoản ngân hàng</h4>
            <table class="bank-account-table">
                <thead>
                <tr>
                    <th>Số tài khoản</th>
                    <th>Tên ngân hàng</th>
                    <th>Mã ngân hàng</th>
                    <th>Số tiền</th>
                    <th>Địa chỉ</th>
                    <th>Số điện thoại</th>
                    <th>Email</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody id="bank-accounts"></tbody>
            </table>

            <button type="button" onclick="addBankAccount()">Thêm tài khoản ngân hàng</button>

            <div class="form-actions">
                <button type="submit">Lưu</button>
                <button type="button" onclick="hideSubform()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".edit-link").forEach(function (link) {
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const maNDT = this.getAttribute("data-maNDT");
                showSubform('edit', maNDT);
            });
        });

        document.getElementById("investor-form").addEventListener("submit", function(e) {
            const maNDT = document.getElementById("maNDT").value;
            const cmnd = document.getElementById("cmnd").value;
            console.log("Biểu mẫu được gửi, Mã NDT (input):", maNDT);
            console.log("Biểu mẫu được gửi, CMND (input):", cmnd);
            console.log("Action của form:", this.action);
        });
    });

    function showSubform(action, maNDT = '') {
        const subform = document.getElementById('subform');
        const title = document.getElementById('subform-title');
        const form = document.getElementById('investor-form');
        const maNDTInput = document.getElementById('maNDT');
        const rowMaNDT = document.getElementById('row-maNDT');

        subform.style.display = 'block';
        form.reset();
        document.getElementById('bank-accounts').innerHTML = '';

        if (action === 'add') {
            title.textContent = 'Thêm nhà đầu tư';
            form.action = '/investors/add';
            maNDTInput.readOnly = false;
            maNDTInput.value = '';
            rowMaNDT.style.display = '';
        } else if (action === 'edit') {
            title.textContent = 'Sửa nhà đầu tư';
            form.action = '/investors/edit';
            maNDTInput.readOnly = true;
            maNDTInput.value = maNDT;
            rowMaNDT.style.display = '';

            const editLink = document.querySelector(`[data-maNDT="${maNDT}"]`);
            maNDTInput.value = editLink.getAttribute('data-maNDT');
            document.querySelector("[name=hoTen]").value = editLink.getAttribute('data-hoTen');
            document.querySelector("[name=ngaySinh]").value = editLink.getAttribute('data-ngaySinh');
            document.querySelector("[name=diaChi]").value = editLink.getAttribute('data-diaChi');
            document.querySelector("[name=phone]").value = editLink.getAttribute('data-phone');
            document.querySelector("[name=cmnd]").value = editLink.getAttribute('data-cmnd');
            document.querySelector("[name=gioiTinh]").value = editLink.getAttribute('data-gioiTinh');
            document.querySelector("[name=email]").value = editLink.getAttribute('data-email');
        }
    }

    function hideSubform() {
        document.getElementById('subform').style.display = 'none';
    }

    function addBankAccount() {
        const bankAccountsTable = document.getElementById("bank-accounts");
        const newRow = bankAccountsTable.insertRow();
        newRow.innerHTML = `
            <td><input type="text" name="bankAccount[accountNumber]" maxlength="20" required /></td>
            <td><input type="text" name="bankAccount[bankName]" maxlength="50" required /></td>
            <td><input type="text" name="bankAccount[bankCode]" maxlength="20" required /></td>
            <td><input type="text" name="bankAccount[amount]" maxlength="20" required /></td>
            <td><input type="text" name="bankAccount[address]" maxlength="100" required /></td>
            <td><input type="text" name="bankAccount[phone]" maxlength="15" required /></td>
            <td><input type="email" name="bankAccount[email]" maxlength="50" required /></td>
            <td><button type="button" onclick="removeBankAccount(this)">Xóa</button></td>
        `;
    }

    function removeBankAccount(button) {
        const row = button.closest("tr");
        row.parentNode.removeChild(row);
    }
</script>
</body>
</html>
