<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng ký</title>
	<link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>
<div class="register-container">
	<h2>Quản lý tài khoản đăng nhập</h2>
	<form th:action="@{/create}" method="post">
		<!-- Tên đăng nhập -->
		<label for="tenDangNhap">Tên đăng nhập:</label>
		<input type="text" id="tenDangNhap" name="tenDangNhap" readonly required>

		<!-- Mật khẩu -->
		<div id="matKhauContainer">
			<label for="matKhau">Mật khẩu:</label>
			<input type="password" id="matKhau" name="matKhau">
		</div>

		<!-- Hành động -->
		<div class="radio-group-row">
			<label>Hành động:</label>
			<label><input type="radio" id="actionCreate" name="action" value="create" th:checked="${action == 'create'}"> Tạo tài khoản</label>
			<label><input type="radio" id="actionDelete" name="action" value="delete" th:checked="${action == 'delete'}"> Xóa tài khoản</label>
		</div>

		<!-- Nhóm -->
		<div class="radio-group-row">
			<label>Thuộc nhóm:</label>
			<label><input type="radio" id="roleNhanVien" name="loai" value="nhanvien" required> Nhân viên</label>
			<label><input type="radio" id="roleNhaDauTu" name="loai" value="nhadautu"> Nhà đầu tư</label>
		</div>

		<!-- Dropdown Nhân viên -->
		<div id="nhanvienDropdown">
			<label for="maNV">Chọn nhân viên:</label>
			<select id="maNV" name="maLienKet" onchange="updateUsername(this)">
				<option value="" disabled selected>-- Chọn nhân viên --</option>
				<option th:each="nv : ${action == 'create' ? nhanViensWithoutAccount : nhanViensWithAccount}"
						th:text="${nv.hoTen}"
						th:value="${nv.maNV}"
						th:attr="data-ma=${nv.maNV}">
				</option>
			</select>
		</div>

		<!-- Dropdown Nhà đầu tư -->
		<div id="nhadautuDropdown" style="display:none;">
			<label for="maNDT">Chọn nhà đầu tư:</label>
			<select id="maNDT" name="maLienKet" onchange="updateUsername(this)">
				<option value="" disabled selected>-- Chọn nhà đầu tư --</option>
				<option th:each="ndt : ${action == 'create' ? nhaDauTusWithoutAccount : nhaDauTusWithAccount}"
						th:text="${ndt.hoTen}"
						th:value="${ndt.maNDT}"
						th:attr="data-ma=${ndt.maNDT}">
				</option>
			</select>
		</div>

		<button type="submit">Thực hiện</button>
	</form>

	<p th:if="${error}" class="error" th:text="${error}"></p>
	<p th:if="${success}" class="success" th:text="${success}"></p>
</div>

<script th:inline="javascript">
	function toggleFields() {
		const isNDT = document.getElementById('roleNhaDauTu').checked;
		const isCreate = document.getElementById('actionCreate').checked;

		// Ẩn/hiện dropdown
		document.getElementById('nhanvienDropdown').style.display = !isNDT ? 'block' : 'none';
		document.getElementById('nhadautuDropdown').style.display = isNDT ? 'block' : 'none';

		// Ẩn/hiện trường mật khẩu
		document.getElementById('matKhauContainer').style.display = isCreate ? 'block' : 'none';

		// Cập nhật tên đăng nhập
		const dropdown = isNDT ? document.getElementById('maNDT') : document.getElementById('maNV');
		updateUsername(dropdown);
	}

	function updateUsername(selectElement) {
		const selectedOption = selectElement.options[selectElement.selectedIndex];
		if (selectedOption) {
			const ma = selectedOption.getAttribute("data-ma");
			document.getElementById('tenDangNhap').value = ma ? ma.trim() : '';
		} else {
			document.getElementById('tenDangNhap').value = '';
		}
	}

	document.addEventListener('DOMContentLoaded', () => {
		toggleFields();
		document.getElementById('roleNhanVien').addEventListener('change', toggleFields);
		document.getElementById('roleNhaDauTu').addEventListener('change', toggleFields);
		document.getElementById('actionCreate').addEventListener('change', () => {
			window.location.href = '/register?action=create';
		});
		document.getElementById('actionDelete').addEventListener('change', () => {
			window.location.href = '/register?action=delete';
		});
	});
</script>
</body>
</html>
