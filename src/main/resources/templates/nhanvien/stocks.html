<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách cổ phiếu</title>
    <link rel="stylesheet" th:href="@{/css/stocks.css}">
</head>
<body>
<div>
    <!-- Toolbar -->
    <div class="toolbar">
        <button type="button" class="toolbar-btn" onclick="showAddForm(); return false;">Thêm</button> |
        <form th:action="@{/stocks/reload}" method="get" style="display:inline;">
            <button type="submit" class="toolbar-btn">Reload</button> |
        </form>
        <form th:action="@{/stocks/save-all}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn" th:disabled="${temporaryStocks.isEmpty()}">Ghi tất cả</button>
        </form> |
        <form th:action="@{/stocks/search}" method="post" style="display:inline;">
            <input type="text" name="query" placeholder="Tìm kiếm..."/>
            <button type="submit" class="toolbar-btn">Tìm</button>
        </form> |
        <form th:action="@{/stocks/undo}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn" th:disabled="${!canUndo}">Hoàn tác</button>
        </form> |
        <form th:action="@{/stocks/clear-undo}" method="post" style="display:inline;">
            <button type="submit" class="toolbar-btn btn btn-danger">Thoát</button>
        </form>
    </div>

    <!-- Thông báo -->
    <div th:if="${message}" th:class="'alert ' + (${messageType}=='success'?'alert-success':'alert-danger')" role="alert">
        <span th:text="${message}"></span>
    </div>

    <!-- Bảng danh sách -->
    <table class="table">
        <thead>
        <tr>
            <th>Mã CP</th>
            <th>Tên công ty</th>
            <th>Địa chỉ</th>
            <th>Số lượng phát hành</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <!-- Duyệt qua stocks.content -->
        <tr th:each="stock : ${stocks.content}"
            th:classappend="${temporaryMaCPList.contains(stock.maCP)} ? 'unsaved'">
            <td th:text="${stock.maCP}"></td>
            <td th:text="${stock.tenCty}"></td>
            <td th:text="${stock.diaChi}"></td>
            <td th:text="${stock.soLuongPH}"></td>
            <td>
                <!-- Nếu cổ phiếu đã bị xóa: chỉ hiển thị nút "Hoàn tác xóa" -->
                <form th:if="${stock.daXoa}" th:action="@{/stocks/undo-delete}" method="post" style="display:inline;">
                    <input type="hidden" name="maCP" th:value="${stock.maCP}" />
                    <button type="submit" class="toolbar-btn">Hoàn tác xóa</button>
                </form>

                <!-- Nếu chưa bị xóa: hiển thị Sửa và Xóa -->
                <div th:if="${!stock.daXoa}">
                    <button type="button" class="edit-link"
                            th:attr="data-maCP=${stock.maCP},
                             data-tenCty=${stock.tenCty},
                             data-diaChi=${stock.diaChi},
                             data-soLuongPH=${stock.soLuongPH}">Sửa</button> |

                    <!-- Nếu là cổ phiếu tạm thời -->
                    <form th:if="${temporaryMaCPList.contains(stock.maCP)}"
                          th:action="@{/stocks/remove-temp}" method="post" style="display:inline;">
                        <input type="hidden" name="maCP" th:value="${stock.maCP}" />
                        <button type="submit" class="delete-btn" onclick="return confirm('Xóa khỏi danh sách tạm?')">Xóa</button>
                    </form>

                    <!-- Nếu là cổ phiếu trong DB -->
                    <form th:unless="${temporaryMaCPList.contains(stock.maCP)}"
                          th:action="@{/stocks/delete}" method="post" style="display:inline;">
                        <input type="hidden" name="maCP" th:value="${stock.maCP}" />
                        <button type="submit" class="delete-btn" onclick="return confirm('Xóa khỏi hệ thống?')">Xóa</button>
                    </form>
                </div>
            </td>
        </tr>


        <!-- Nếu không có bản ghi -->
        <tr th:if="${stocks.empty}">
            <td colspan="7" style="text-align:center;">Không có dữ liệu cổ phiếu.</td>
        </tr>
        </tbody>


    </table>

    <!-- Phân trang -->
    <div class="pagination">
        <span th:if="${stocks.hasPrevious()}">
            <a th:href="@{/stocks(page=${stocks.number-1},size=${stocks.size})}">« Trước</a>
        </span>
        <span th:each="i : ${#numbers.sequence(0, stocks.totalPages-1)}">
            <a th:href="@{/stocks(page=${i},size=${stocks.size})}"
               th:text="${i+1}"
               th:classappend="${i==stocks.number} ? 'active'">
            </a>
        </span>
        <span th:if="${stocks.hasNext()}">
            <a th:href="@{/stocks(page=${stocks.number+1},size=${stocks.size})}">Sau »</a>
        </span>
    </div>

    <div id="add-form" class="subform-container" style="display:none;">
	    <h3>Thêm cổ phiếu</h3>
	    <form th:action="@{/stocks/add-temp(page=${stocks.number},size=${stocks.size})}" method="post">
	        <input type="hidden" name="page" th:value="${stocks.number}"/>
	        <input type="hidden" name="size" th:value="${stocks.size}"/>
	
	        <!-- Mã CP: chỉ chữ hoa, không số/ký tự đặc biệt -->
	        <label>Mã CP: 
	            <input type="text" name="maCP" required 
	                   pattern="^[A-Z]+$" 
	                   title="Chỉ nhập chữ in hoa, không chứa số hoặc ký tự đặc biệt." 
	                   autocomplete="off"/>
	        </label><br/>
	
	        <!-- Tên công ty -->
			<label>Tên công ty: 
			    <input type="text" name="tenCty" required 
			           pattern="^([A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ]*([ \-,][A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ]*)*)$" 
			           title="Chữ cái đầu mỗi từ viết hoa. Cho phép khoảng trắng, dấu '-' và ','." 
			           autocomplete="off"/>
			</label><br/>
			
			<!-- Địa chỉ -->
			<label>Địa chỉ: 
			    <input type="text" name="diaChi" required 
			           pattern="^([A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ0-9][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ0-9]*([ \/,\\-][A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ0-9][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ0-9]*)*)$"
			           title="Viết hoa chữ cái đầu mỗi phần. Cho phép chữ, số, dấu '/' , ',' và '-'." 
			           autocomplete="off"/>
			</label><br/>
	
	        <!-- Số lượng phát hành: số nguyên dương -->
	        <label>Số lượng phát hành: 
	            <input type="number" name="soLuongPH" required min="1" step="1" autocomplete="off"/>
	        </label><br/>
	
	        <button type="submit">Lưu vào tạm</button>
	        <button type="button" onclick="hideSubform('add-form')">Hủy</button>
	    </form>
	</div>


    <!-- Form Sửa -->
    <div id="edit-form" class="subform-container" style="display:none;">
        <h3>Sửa cổ phiếu</h3>
        <form th:action="@{/stocks/edit-temp}" method="post">
            <input type="hidden" name="maCP" id="maCP"/>
            
            <label>Tên công ty: <input type="text" name="tenCty" required 
            	pattern="^([A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ]*([ \-,][A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ]*)*)$" 
			    title="Chữ cái đầu mỗi từ viết hoa. Cho phép khoảng trắng, dấu '-' và ','."
			    autocomplete="off"/></label><br/>
			    
            <label>Địa chỉ: <input type="text" name="diaChi" required
            	pattern="^([A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ0-9][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ0-9]*([ \/,\\-][A-ZÀÁÂÃÈÉÊÌÍÒÓÔÕÙÚĂĐĨŨƯẠ-ỹ0-9][a-zàáâãèéêìíòóôõùúăđĩũưạ-ỹ0-9]*)*)$"
			    title="Viết hoa chữ cái đầu mỗi phần. Cho phép chữ, số, dấu '/' , ',' và '-'."
			    autocomplete="off"/></label><br/>
			    
            <label>Số lượng phát hành: <input type="number" name="soLuongPH" required autocomplete="off"/></label><br/>
            <button type="submit">Lưu thay đổi</button>
            <button type="button" onclick="hideSubform('edit-form')">Hủy</button>
        </form>
    </div>

</div>

<script>
    function disableToolbarButtons() {
        document.querySelectorAll('.toolbar-btn').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.edit-link').forEach(btn => btn.disabled = true);
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = true);
    }
    function enableToolbarButtons() {
        document.querySelectorAll('.toolbar-btn').forEach(btn => btn.disabled = false);
        document.querySelectorAll('.edit-link').forEach(btn => btn.disabled = false);
        document.querySelectorAll('.delete-btn').forEach(btn => btn.disabled = false);
    }
    function showAddForm() {
        document.getElementById('add-form').style.display = 'block';
        document.getElementById('edit-form').style.display = 'none';
        disableToolbarButtons();
    }

    function hideSubform(id) {
        document.getElementById(id).style.display = 'none';
        enableToolbarButtons();
    }
    function showEditForm(data) {
        const form = document.querySelector('#edit-form form');
        form.maCP.value = data.maCP;
        form.tenCty.value = data.tenCty;
        form.diaChi.value = data.diaChi;
        form.soLuongPH.value = data.soLuongPH;
        document.getElementById('edit-form').style.display = 'block';
        document.getElementById('add-form').style.display = 'none';
        disableToolbarButtons();
    }

    document.addEventListener("DOMContentLoaded", function () {
        document.querySelectorAll(".edit-link").forEach(link =>
            link.addEventListener("click", function (e) {
                e.preventDefault();
                const maCP = this.getAttribute("data-maCP");
                const tenCty = this.getAttribute("data-tenCty");
                const diaChi = this.getAttribute("data-diaChi");
                const soLuongPH = this.getAttribute("data-soLuongPH");
                showEditForm({ maCP, tenCty, diaChi, soLuongPH });
            })
        );
    });
</script>
</body>
</html>
