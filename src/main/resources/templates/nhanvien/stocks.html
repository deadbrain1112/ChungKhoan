<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách cổ phiếu</title>
    <link rel="stylesheet" th:href="@{/css/stocks.css}">
</head>
<body>
<div>
    <div class="toolbar">
        <a href="#" onclick="showSubform('add'); return false;">Thêm</a> |
        <a th:href="@{/stocks}">Reload</a> |
        <form th:action="@{/stocks/undo}" method="post" style="display:inline;">
            <button type="submit" th:disabled="${!canUndo}">Hoàn tác</button>
        </form>
        <form th:action="@{/stocks/search}" method="post" style="display: inline;">
            <input type="text" name="query" placeholder="Tìm kiếm...">
            <button type="submit">Tìm</button>
        </form> |
        <form th:action="@{/stocks/undo}" method="post" style="display:inline;">
			<button type="submit" th:disabled="${!canUndo}">Hoàn tác</button>
		</form>
		<form th:action="@{/stocks/clear-undo}" method="post" style="display:inline;">
		    <button type="submit" class="btn btn-danger">Thoát</button>
		</form>
    </div>

    <div th:if="${message}" th:class="'alert ' + (${messageType} == 'success' ? 'alert-success' : 'alert-danger')"
         role="alert" style="color: red;">
        <span th:text="${message}"></span>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Mã CP</th>
            <th>Tên công ty</th>
            <th>Địa chỉ</th>
            <th>Số lượng phát hành</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${stocks.empty}">
            <td colspan="5" style="text-align: center;" th:text="${noDataMessage}"></td>
        </tr>
        <tr th:each="stock : ${stocks.content}">
            <td th:text="${stock.maCP}"></td>
            <td th:text="${stock.tenCty}"></td>
            <td th:text="${stock.diaChi}"></td>
            <td th:text="${stock.soLuongPH}"></td>
            <td>
                <a href="#" class="edit-link"
                   th:attr="data-maCP=${stock.maCP},
                            data-tenCty=${stock.tenCty},
                            data-diaChi=${stock.diaChi},
                            data-soLuongPH=${stock.soLuongPH}">Sửa</a> |
                <a href="#" onclick="showSubform('add'); return false;">Ghi</a> |
                <form th:action="@{/stocks/delete}" method="post" style="display:inline;">
                    <input type="hidden" name="maCP" th:value="${stock.maCP}" />
                    <button type="submit" onclick="return confirm('Bạn có chắc muốn xóa?')">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="pagination">
        <span th:if="${stocks.hasPrevious()}">
            <a th:href="@{/stocks(page=${stocks.number - 1})}">« Trước</a>
        </span>
        <span th:each="i : ${#numbers.sequence(0, stocks.totalPages - 1)}">
            <a th:href="@{/stocks(page=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == stocks.number} ? 'active'"></a>
        </span>
        <span th:if="${stocks.hasNext()}">
            <a th:href="@{/stocks(page=${stocks.number + 1})}">Sau »</a>
        </span>
    </div>

    <!-- Subform -->
    <div id="subform" class="subform-container">
        <h3 id="subform-title"></h3>
        <form id="stock-form" th:action="@{/stocks/add}" th:object="${stock}" method="post">
            <table class="subform-table">
                <tr>
                    <td><label>Mã cổ phiếu:</label></td>
                    <td><input type="text" th:field="*{maCP}" id="maCP" name="maCP" /></td>
                </tr>
                <tr>
                    <td><label>Tên công ty:</label></td>
                    <td><input type="text" th:field="*{tenCty}" name="tenCty" /></td>
                </tr>
                <tr>
                    <td><label>Địa chỉ:</label></td>
                    <td><input type="text" th:field="*{diaChi}" name="diaChi" /></td>
                </tr>
                <tr>
                    <td><label>Số lượng phát hành:</label></td>
                    <td><input type="text" th:field="*{soLuongPH}" name="soLuongPH" /></td>
                </tr>
            </table>
            <div class="form-actions">
                <button type="submit">Lưu</button>
                <button type="button" onclick="hideSubform()">Hủy</button>
            </div>
        </form>
    </div>
</div>

<script>
function showSubform(action, data = {}) {
    const subform = document.getElementById('subform');
    const title = document.getElementById('subform-title');
    const form = document.getElementById('stock-form');
    const maCPInput = document.getElementById('maCP');

    subform.classList.add('active');
    form.reset();

    maCPInput.disabled = false; // Cho phép sửa mã CP trong mọi trường hợp

    // Xóa input hidden nếu có (đề phòng lần trước dùng hidden)
    const oldHidden = document.getElementById("hiddenMaCP");
    if (oldHidden) oldHidden.remove();

    if (action === 'add') {
        title.textContent = 'Thêm cổ phiếu';
        form.action = '/stocks/add';
    } else if (action === 'edit') {
        title.textContent = 'Sửa cổ phiếu';
        form.action = '/stocks/edit';

        maCPInput.value = data.maCP;
        form.querySelector('[name="tenCty"]').value = data.tenCty;
        form.querySelector('[name="diaChi"]').value = data.diaChi;
        form.querySelector('[name="soLuongPH"]').value = data.soLuongPH;
    }
}

function hideSubform() {
    const subform = document.getElementById('subform');
    subform.classList.remove('active');
}

document.addEventListener("DOMContentLoaded", function () {
    document.querySelectorAll(".edit-link").forEach(function (link) {
        link.addEventListener("click", function (e) {
            e.preventDefault();
            const maCP = this.getAttribute("data-maCP");
            const tenCty = this.getAttribute("data-tenCty");
            const diaChi = this.getAttribute("data-diaChi");
            const soLuongPH = this.getAttribute("data-soLuongPH");

            showSubform('edit', { maCP, tenCty, diaChi, soLuongPH });
        });
    });
});
</script>

</body>
</html>
