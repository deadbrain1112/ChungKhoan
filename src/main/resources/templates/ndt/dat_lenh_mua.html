<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lệnh mua</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/dat_lenh_mua.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{ndt/header :: menu(${taiKhoan})}"></div>

    <section class="buy-container">
        <form id="datLenhForm" th:action="@{/nhadautu/dat-lenh-mua}" method="post">
            <table class="buy-table">
                <tbody>
                    <!-- Hiển thị thông báo lỗi -->
                    <tr th:if="${error != null}">
                        <td colspan="2" style="color: red;">
                            <strong th:text="${error}"></strong>
                        </td>
                    </tr>

                    <!-- Hiển thị thông báo thành công -->
                    <tr th:if="${success != null}">
                        <td colspan="2" style="color: green;">
                            <strong th:text="${success}"></strong>
                        </td>
                    </tr>

                    <tr>
                        <th>Số dư tiền được phép giao dịch</th>
                        <td><span id="soDuTien" th:text="${formattedSoTien}">0 VND</span></td>
                    </tr>

                    <tr>
                        <th>Chứng khoán</th>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <input list="dsMaCP" type="text" name="maCP" id="maCP" placeholder="Nhập hoặc chọn mã cổ phiếu..." 
                                	style="flex: 1; margin-right: 10px;" autocomplete="off"/>
                                <datalist id="dsMaCP">
                                    <option th:each="cp : ${tatCaCoPhieu}" th:value="${cp.maCP}" th:text="${cp.maCP}"></option>
                                </datalist>
                            </div>
                            <div id="giaHienThi" style="margin-top: 10px; display: none;">
                                <div><strong>Mã cổ phiếu: </strong><span id="maCPShow"></span></div>
                                <div><strong>Giá tham chiếu: </strong><span id="giaThamChieu"></span></div>
                                <div><strong>Giá trần: </strong><span id="giaTran"></span></div>
                                <div><strong>Giá sàn: </strong><span id="giaSan"></span></div>
                            </div>
                            <div id="khongTimThay" style="color:red; display: none;">Không tìm thấy cổ phiếu!</div>
                        </td>
                    </tr>

                    <tr>
                        <th>Tài khoản tiền</th>
                        <td>
                            <select name="nganHang" id="nganHangSelect">
                                <option th:each="tk : ${danhSachTaiKhoan}"
                                        th:value="${tk.nganHang.maNH}"
                                        th:text="${tk.nganHang.tenNH}"
                                        th:selected="${tk.nganHang.maNH == taiKhoan?.nganHang?.maNH}">
                                </option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>Loại lệnh</th>
                        <td>
                            <label><input type="radio" name="loaiLenh" value="LO" checked /> LO</label>
                            <label><input type="radio" name="loaiLenh" value="ATO" /> ATO</label>
                            <label><input type="radio" name="loaiLenh" value="ATC" /> ATC</label>
                        </td>
                    </tr>

                    <tr>
                        <th>Số lượng</th>
                        <td><input type="text" name="soLuong" id="soLuong" autocomplete="off"/></td>
                    </tr>

                    <tr>
                        <th>Giá</th>
                        <td><input type="text" name="gia" id="gia" autocomplete="off"/></td>
                    </tr>

                    <tr>
                        <th>Mật khẩu đặt lệnh</th>
                        <td><input type="password" name="matKhau" /></td>
                    </tr>

                    <tr>
                        <th>Tổng số tiền mua</th>
                        <td><span id="tongTienMua">0 VND</span></td>
                    </tr>

                    <tr>
                        <th>Hành động</th>
                        <td colspan="2" class="action-buttons">
                            <button type="submit" class="submit-btn">Đặt lệnh mua</button>
                            <button type="button" id="xoaBtn" class="reset-btn">Xóa</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </section>
</div>

<script src="/js/dat_lenh_mua.js"></script>
<script src="/js/popup.js"></script>

</body>
</html>
