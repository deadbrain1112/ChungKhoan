<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lệnh mua</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/dat_lenh_mua.css}">
</head>
<body>
<div class="container">
    <div th:replace="~{ndt/header :: menu(${taiKhoan})}"></div>

    <section class="buy-container">
        <form id="datLenhForm" th:action="@{/nhadautu/dat-lenh-mua}" method="post">
            <table class="buy-table">
                <tbody>
                    <tr th:if="${error}">
                        <td colspan="2"><strong th:text="${error}"></strong></td>
                    </tr>
                    <tr th:if="${success}">
                        <td colspan="2"><strong th:text="${success}"></strong></td>
                    </tr>

                    <tr>
                        <th>Số dư tiền được phép giao dịch</th>
                        <td><span id="soDuTien" th:text="${formattedSoTien}">0 VND</span></td>
                    </tr>

                    <tr>
                        <th>Chứng khoán</th>
                        <td>
                            <div style="display: flex; align-items: center;">
                                <input list="dsMaCP" type="text" name="maCP" id="maCP" placeholder="Nhập hoặc chọn mã cổ phiếu..." style="flex: 1; margin-right: 10px;" />
                                <datalist id="dsMaCP">
                                    <option th:each="cp : ${tatCaCoPhieu}" th:value="${cp.maCP}" th:text="${cp.maCP}"></option>
                                </datalist>
                                <button type="button" id="xemGiaBtn">Xem giá</button>
                            </div>
                            <div id="giaHienThi" th:if="${lichSuGia != null}" style="margin-top: 10px;">
                                <div><strong>Mã cổ phiếu: </strong><span th:text="${lichSuGia.maCP}"></span></div>
                                <div><strong>Giá tham chiếu: </strong><span id="giaThamChieu" th:text="${giaThamChieu}"></span></div>
                                <div><strong>Giá trần: </strong><span id="giaTran" th:text="${giaTran}"></span></div>
                                <div><strong>Giá sàn: </strong><span id="giaSan" th:text="${giaSan}"></span></div>
                            </div>
                            <div id="khongTimThay" th:if="${khongTimThay}" style="color:red;">Không tìm thấy cổ phiếu!</div>
                        </td>
                    </tr>

                    <tr>
                        <th>Tài khoản tiền</th>
                        <td>
                            <select name="nganHang">
                                <option th:each="tk : ${danhSachTaiKhoan}"
                                        th:value="${tk.nganHang.maNH}"
                                        th:text="${tk.nganHang.tenNH}"
                                        th:selected="${tk.nganHang.maNH == taiKhoan?.nganHang?.maNH}">
                                </option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>Loại lệnh</th>
                        <td>
                            <label><input type="radio" name="loaiLenh" value="LO" checked /> LO</label>
                            <label><input type="radio" name="loaiLenh" value="ATO" /> ATO</label>
                            <label><input type="radio" name="loaiLenh" value="ATC" /> ATC</label>
                        </td>
                    </tr>

                    <tr>
                        <th>Số lượng</th>
                        <td><input type="number" name="soLuong" id="soLuong" /></td>
                    </tr>

                    <tr>
                        <th>Giá</th>
                        <td><input type="number" name="gia" id="gia" step="0.01" required /></td>
                    </tr>

                    <tr>
                        <th>Mật khẩu đặt lệnh</th>
                        <td><input type="password" name="matKhau" /></td>
                    </tr>

                    <tr>
                        <th>Tổng số tiền mua</th>
                        <td><span id="tongTienMua">0 VND</span></td>
                    </tr>

                    <tr>
                        <th>Hành động</th>
                        <td colspan="2" class="action-buttons">
                            <button type="submit" class="submit-btn">Đặt lệnh mua</button>
                            <button type="button" id="xoaBtn" class="reset-btn">Xóa</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </form>
    </section>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const xemGiaBtn = document.getElementById("xemGiaBtn");
    xemGiaBtn.addEventListener("click", function () {
        const maCP = document.getElementById("maCP").value.trim();
        if (!maCP) return alert("Vui lòng nhập mã cổ phiếu!");
        const url = new URL(window.location.href);
        url.searchParams.set('maCP', maCP);
        window.location.href = url.toString();
    });

    const giaInput = document.getElementById("gia");
    const loaiLenhRadios = document.querySelectorAll("input[name='loaiLenh']");
    const soLuongInput = document.getElementById("soLuong");
    const tongTienMua = document.getElementById("tongTienMua");

    const updateTongTien = () => {
        const soLuong = parseFloat(soLuongInput.value) || 0;
        const gia = parseFloat(giaInput.value) || 0;
        tongTienMua.textContent = (soLuong * gia).toLocaleString('vi-VN') + " VND";
    };

    loaiLenhRadios.forEach(radio => {
        radio.addEventListener("change", function () {
            if (this.value === "ATO" || this.value === "ATC") {
                giaInput.value = "";
                giaInput.readOnly = true;
                giaInput.removeAttribute("name"); 
            } else {
                giaInput.readOnly = false;
                giaInput.setAttribute("name", "gia"); 
            }
            updateTongTien();
        });
    });

    soLuongInput.addEventListener("input", updateTongTien);
    giaInput.addEventListener("input", updateTongTien);

    document.getElementById("xoaBtn").addEventListener("click", () => {
        document.getElementById("datLenhForm").reset();
        tongTienMua.textContent = "0 VND";
        giaInput.removeAttribute("disabled");
    });
});

document.addEventListener("DOMContentLoaded", function () {
    const openButton = document.getElementById("openPasswordPopup");
    if (openButton) {
        console.log("Open button found");
        openButton.addEventListener("click", function (e) {
            e.preventDefault();
            console.log("Open button clicked");
            openPopup();
        });
    } else {
        console.error("Element #openPasswordPopup not found");
    }
});

// Đổi mk
window.openPopup = function () {
    const popup = document.getElementById("changePasswordPopup");
    if (popup) {
        console.log("Opening popup");
        popup.style.display = "flex";
    } else {
        console.error("Element #changePasswordPopup not found");
    }
}

window.closePopup = function () {
    const popup = document.getElementById("changePasswordPopup");
    if (popup) {
        console.log("Closing popup");
        popup.style.display = "none";
    } else {
        console.error("Element #changePasswordPopup not found");
    }
}
</script>
</body>
</html>
