<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Dịch Chứng Khoán</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div th:fragment="menu(taiKhoan)">
    <header>
        <div class="header-left">
            <h1>GIAO DỊCH CHỨNG KHOÁN</h1>
            <p>STOCK EXCHANGE</p>
        </div>
        <div class="header-right">
            <p th:if="${nhaDauTu != null}">
                Xin Chào - <span th:text="${nhaDauTu.hoTen}"></span>
            </p>
            <p th:if="${nhaDauTu == null}">
                Xin Chào - <span>Thông tin nhà đầu tư không tồn tại</span>
            </p>
            <a href="#" id="openPasswordPopup" style="margin-right: 12px;">Đổi mật khẩu giao dịch</a>
            <a th:href="@{/logout}">Đăng Xuất</a>
        </div>

        <!-- Popup container -->
        <div id="changePasswordPopup" class="popup-overlay" style="display: none;">
            <div class="popup-content">
                <h3>Đổi Mật Khẩu Giao Dịch</h3>
                <form id="changePasswordForm" action="/nhadautu/doi-mat-khau-gd" method="post">
                    <label>Mật khẩu mới:</label>
                    <input type="password" name="newPassword" required />
                    <label>Nhập lại mật khẩu:</label>
                    <input type="password" name="confirmPassword" required />
                    <div class="popup-actions">
                        <button type="submit">Xác nhận</button>
                        <button type="button" onclick="closePopup()">Hủy</button>
                    </div>
                </form>
            </div>
        </div>
    </header>

    <nav>
        <div class="nav-buttons">
            <a th:href="@{/nhadautu/home}" class="nav-button active">Tra Cứu Số Dư</a>
            <a th:href="@{/nhadautu/sao-ke-gdck}" class="nav-button">Sao Kê GDCK</a>
            <a th:href="@{/nhadautu/sao-ke-tien}" class="nav-button">Sao Kê Tiền</a>
            <a th:href="@{/nhadautu/dat-lenh-mua}" class="nav-button">Đặt Lệnh Mua</a>
            <a th:href="@{/nhadautu/dat-lenh-ban}" class="nav-button">Đặt Lệnh Bán</a>
            <a th:href="@{/stock-board}" class="nav-button">Bảng Giao Dịch Chứng Khoán</a>
        </div>
    </nav>
</div>

<script src="/js/popup.js"></script>
</body>
</html>
