<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sao Kê Giao Dịch</title>
    <link rel="stylesheet" th:href="@{/css/sao_ke_gdck.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="sao-ke">
<div class="container">
	<div th:replace="~{ndt/header :: menu(taiKhoan)}"></div>

    <main class="sao-ke-container">
        <h2>Sao Kê Giao Dịch Chứng Khoán</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Lọc theo trạng thái -->
        <h3>Sao kê tất cả lệnh giao dịch</h3>
        <form id="filterForm" method="get" th:action="@{/nhadautu/sao-ke-gdck}">
            <label for="trangThai">Lọc theo trạng thái:</label>
            <select name="trangThai" id="trangThai">
                <option value="">Tất cả</option>
                <option value="Chờ" th:selected="${selectedTrangThai == 'Chờ'}">Chờ</option>
                <option value="Hết" th:selected="${selectedTrangThai == 'Hết'}">Hết</option>
                <option value="Hủy" th:selected="${selectedTrangThai == 'Hủy'}">Hủy</option>
                <option value="Một phần" th:selected="${selectedTrangThai == 'Một phần'}">Một phần</option>
            </select>
        </form>

        <!-- Sao kê lệnh theo mã cổ phiếu trong khoảng thời gian -->
        <h3>Sao kê lệnh giao dịch theo mã cổ phiếu</h3>
		<form method="post" th:action="@{/nhadautu/lich-su-lenh}" class="filter-section ma-cp-filter">
		    <div>
		        <div>
		            <label for="maCP">Mã Cổ Phiếu:</label>
		            <input type="text" name="maCP" id="maCP" required th:value="${inputMaCP}"/>
		        </div>
		        <label for="tuNgay">Từ Ngày:</label>
		        <input type="date" name="tuNgay" id="tuNgay" required th:value="${inputTuNgay}"/>
		    </div>
		    
		    <div>
		        <div>
			        <div>
			            <label for="trangThai">Lọc theo trạng thái:</label>
			            <select name="trangThai" id="trangThai2">
			                <option value="">Tất cả</option>
			                <option value="Chờ" th:selected="${selectedTrangThai == 'Chờ'}">Chờ</option>
			                <option value="Hết" th:selected="${selectedTrangThai == 'Hết'}">Hết</option>
			                <option value="Hủy" th:selected="${selectedTrangThai == 'Hủy'}">Hủy</option>
			                <option value="Một phần" th:selected="${selectedTrangThai == 'Một phần'}">Một phần</option>
			            </select>
			        </div>
		        </div>
		        <div>
		            <label for="denNgay">Đến Ngày:</label>
		            <input type="date" name="denNgay" id="denNgay" required th:value="${inputDenNgay}"/>
		        </div>
		    </div>
		    
		    <div>
		        <button type="submit">Xem Sao Kê</button>
		    </div>
		</form>

        <!-- Bảng sao kê giao dịch chứng khoán cá nhân -->
        <div class="table-wrapper" th:if="${lenhDatList != null and !#lists.isEmpty(lenhDatList)}">
            <table class="sao-ke-table">
                <thead>
                    <tr>
                        <th>Mã Lệnh</th>
                        <th>Loại GD</th>
                        <th>Loại Lệnh</th>
                        <th>Mã CP</th>
                        <th>Giá Đặt</th>
                        <th>Khối Lượng Đặt</th>
                        <th>SL Khớp</th>
                        <th>Giá Khớp</th>
                        <th>Giờ Khớp</th>
                        <th>Giờ Đặt</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tr th:each="lenh : ${lenhDatList}">
                    <td th:text="${lenh.maGD}"></td>
                    <td th:text="${lenh.loaiGD == 'M' ? 'Mua' : 'Bán'}"></td>
                    <td th:text="${lenh.loaiLenh}"></td>
                    <td th:text="${lenh.coPhieu.maCP}"></td>
                    <td th:text="${giaFormattedMap[lenh.maGD]}"></td>
                    <td th:text="${mapFormattedSoLuongDat[lenh.maGD]}"></td>
					<td th:text="${mapFormattedSoLuongKhop[lenh.maGD]}"></td>
                    <td th:text="${mapGiaKhop[lenh.maGD]}"></td>
                    <td th:text="${mapNgayKhop[lenh.maGD] != null ? #temporals.format(mapNgayKhop[lenh.maGD], 'dd/MM/yyyy HH:mm:ss') : '—'}"></td>
                    <td th:text="${#temporals.format(lenh.ngayGD, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td th:text="${lenh.trangThai}"></td>
                    <td>
                        <button class="btn-sua"
						        th:if="${lenh.trangThai == 'Chờ'}"
						        th:attr="
						            data-magid=${lenh.maGD},
						            data-loaigd=${lenh.loaiGD == 'M' ? 'Mua' : 'Bán'},
						            data-loailenh=${lenh.loaiLenh},
						            data-macp=${lenh.coPhieu.maCP},
						            data-giadat=${giaFormattedMap[lenh.maGD]},
						            data-soluong=${mapFormattedSoLuongDat[lenh.maGD]}"
						        onclick="handleOpenSuaPopup(this)">
						    Sửa
						</button>

                        <button class="btn-huy" th:if="${lenh.trangThai == 'Chờ'}" th:onclick="|xacNhanHuy(${lenh.maGD})|">Hủy</button>
                    </td>
                </tr>
            </table>
        </div>
    </main>
</div>

<!-- Popup Sửa Lệnh -->
<div id="popupSuaLenh" class="sua-lenh-popup-overlay" style="display:none;"
     th:attr="style=${openPopup} ? 'display:flex;' : 'display:none;'">
    <div class="sua-lenh-popup-content">
        <h3>Sửa Lệnh Giao Dịch</h3>
        
        <div th:if="${popupError}" class="alert alert-danger" th:text="${popupError}"></div>
        
        <form id="formSuaLenh" method="post" th:action="@{/nhadautu/sua-lenh}">
            <input type="hidden" id="popupMaGD" name="maGD" />

            <div class="form-group">
                <label>Mã Lệnh:</label>
                <span id="popupMaGDText"></span>
            </div>
            <div class="form-group">
                <label>Loại Giao Dịch:</label>
                <span id="popupLoaiGD"></span>
            </div>
            <div class="form-group">
                <label>Loại Lệnh:</label>
                <span id="popupLoaiLenh"></span>
            </div>
            <div class="form-group">
                <label>Mã Cổ Phiếu:</label>
                <span id="popupMaCP"></span>
            </div>
            <div class="form-group">
                <label for="popupGiaDat">Giá Đặt:</label>
                <input type="text" id="popupGiaDat" name="giaDat" th:value="${popupGiaDat}"/>
            </div>
            <div class="form-group">
                <label for="popupSoLuong">Khối Lượng:</label>
                <input type="text" id="popupSoLuong" name="soLuong" th:value="${popupSoLuong}" />
            </div>

            <div class="popup-buttons">
                <button type="submit">Xác nhận</button>
                <button type="button" onclick="closeSuaPopup()">Thoát</button>
            </div>
        </form>
    </div>
</div>


<script>
    function xacNhanHuy(maGD) {
        if (confirm("Bạn có chắc chắn muốn hủy lệnh mã " + maGD + " không?")) {
            fetch(`/nhadautu/huy-lenh?maGD=${maGD}`, {
                method: 'POST'
            })
            .then(res => {
                if (res.ok) {
                    alert("Đã hủy lệnh thành công.");
                    location.reload();
                } else {
                    alert("Không thể hủy lệnh. Vui lòng thử lại sau.");
                }
            });
        }
    }

    document.getElementById("trangThai").addEventListener("change", function () {
        document.getElementById("filterForm").submit();
    });
    
    function handleOpenSuaPopup(button) {
        const maGD = button.getAttribute("data-magid");
        const loaiGD = button.getAttribute("data-loaigd");
        const loaiLenh = button.getAttribute("data-loailenh");
        const maCP = button.getAttribute("data-macp");
        const giaDat = button.getAttribute("data-giadat");
        const soLuong = button.getAttribute("data-soluong");

        openSuaPopup(maGD, loaiGD, loaiLenh, maCP, giaDat, soLuong);
    }

    function openSuaPopup(maGD, loaiGD, loaiLenh, maCP, giaDat, soLuong) {
        document.getElementById("popupMaGD").value = maGD;
        document.getElementById("popupMaGDText").innerText = maGD;
        document.getElementById("popupLoaiGD").innerText = loaiGD;
        document.getElementById("popupLoaiLenh").innerText = loaiLenh;
        document.getElementById("popupMaCP").innerText = maCP;

        const giaRaw = (giaDat + "").replace(/[^0-9.]/g, ""); // chỉ giữ số và dấu chấm
        const soLuongRaw = (soLuong + "").replace(/[^0-9]/g, ""); // chỉ giữ số nguyên

        const giaFormatted = giaRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        const soLuongFormatted = soLuongRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        document.getElementById("popupGiaDat").value = giaFormatted;
        document.getElementById("popupSoLuong").value = soLuongFormatted;

        document.getElementById("popupSuaLenh").style.display = "flex";
    }

    function closeSuaPopup() {
        document.getElementById("popupSuaLenh").style.display = "none";
    }
    
    document.getElementById("formSuaLenh").addEventListener("submit", function (e) {
        const giaInput = document.getElementById("popupGiaDat");
        const slInput = document.getElementById("popupSoLuong");
        
        giaInput.value = giaInput.value.replace(/\./g, "").replace(/,/g, "").trim(); // clean format
        slInput.value = slInput.value.replace(/\./g, "").replace(/,/g, "").trim();
    });
    
 	// Tự động format #,### khi nhập input
    function addInputFormatter(id) {
        const input = document.getElementById(id);
        input.addEventListener("input", function () {
            // Lưu vị trí con trỏ trước khi xử lý
            const cursorPos = input.selectionStart;
            const raw = input.value.replace(/\D/g, ""); // chỉ giữ lại số

            if (raw.length === 0) {
                input.value = "";
                return;
            }

            const formatted = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ",");

            const delta = formatted.length - input.value.length;
            input.value = formatted;
            input.setSelectionRange(cursorPos + delta, cursorPos + delta);
        });
    }

addInputFormatter("popupGiaDat");
addInputFormatter("popupSoLuong");
</script>
</body>
</html>
