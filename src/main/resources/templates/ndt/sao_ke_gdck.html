<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sao Kê Giao Dịch</title>
    <link rel="stylesheet" th:href="@{/css/sao_ke_gdck.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="sao-ke">
<div class="container">
	<div th:replace="~{ndt/header :: menu(taiKhoan)}"></div>

    <main class="sao-ke-container">
        <h2>Sao Kê Giao Dịch Chứng Khoán</h2>
        
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <!-- Lọc theo trạng thái -->
        <h3>Sao kê tất cả lệnh giao dịch</h3>
        <form id="filterForm" method="get" th:action="@{/nhadautu/sao-ke-gdck}">
            <label for="trangThai">Lọc theo trạng thái:</label>
            <select name="trangThai" id="trangThai">
                <option value="">Tất cả</option>
                <option value="Chờ" th:selected="${selectedTrangThai == 'Chờ'}">Chờ</option>
                <option value="Hết" th:selected="${selectedTrangThai == 'Hết'}">Hết</option>
                <option value="Hủy" th:selected="${selectedTrangThai == 'Hủy'}">Hủy</option>
                <option value="Một phần" th:selected="${selectedTrangThai == 'Một phần'}">Một phần</option>
            </select>
        </form>

        <!-- Sao kê lệnh theo mã cổ phiếu trong khoảng thời gian -->
        <h3>Sao kê lệnh giao dịch theo mã cổ phiếu</h3>
		<form method="post" th:action="@{/nhadautu/lich-su-lenh}" class="filter-section ma-cp-filter">
		    <!-- First row: Stock code and status select -->
		    <div>
		        <div>
		            <label for="maCP">Mã Cổ Phiếu:</label>
		            <input type="text" name="maCP" id="maCP" required th:value="${inputMaCP}"/>
		        </div>
		        <label for="tuNgay">Từ Ngày:</label>
		        <input type="date" name="tuNgay" id="tuNgay" required th:value="${inputTuNgay}"/>
		    </div>
		    
		    <!-- Second row: Date inputs -->
		    <div>
		        <div>
			        <div>
			            <label for="trangThai">Lọc theo trạng thái:</label>
			            <select name="trangThai" id="trangThai">
			                <option value="">Tất cả</option>
			                <option value="Chờ" th:selected="${selectedTrangThai == 'Chờ'}">Chờ</option>
			                <option value="Hết" th:selected="${selectedTrangThai == 'Hết'}">Hết</option>
			                <option value="Hủy" th:selected="${selectedTrangThai == 'Hủy'}">Hủy</option>
			                <option value="Một phần" th:selected="${selectedTrangThai == 'Một phần'}">Một phần</option>
			            </select>
			        </div>
		        </div>
		        <div>
		            <label for="denNgay">Đến Ngày:</label>
		            <input type="date" name="denNgay" id="denNgay" required th:value="${inputDenNgay}"/>
		        </div>
		    </div>
		    
		    <!-- Third row: Submit button -->
		    <div>
		        <button type="submit">Xem Sao Kê</button>
		    </div>
		</form>

        <!-- Bảng sao kê giao dịch chứng khoán cá nhân -->
        <div class="table-wrapper" th:if="${lenhDatList != null and !#lists.isEmpty(lenhDatList)}">
            <table class="sao-ke-table">
                <thead>
                    <tr>
                        <th>Mã Lệnh</th>
                        <th>Loại GD</th>
                        <th>Loại Lệnh</th>
                        <th>Mã CP</th>
                        <th>Giá Đặt</th>
                        <th>Khối Lượng Đặt</th>
                        <th>SL Khớp</th>
                        <th>Giá Khớp</th>
                        <th>Giờ Khớp</th>
                        <th>Giờ Đặt</th>
                        <th>Trạng thái</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tr th:each="lenh : ${lenhDatList}">
                    <td th:text="${lenh.maGD}"></td>
                    <td th:text="${lenh.loaiGD == 'M' ? 'Mua' : 'Bán'}"></td>
                    <td th:text="${lenh.loaiLenh}"></td>
                    <td th:text="${lenh.coPhieu.maCP}"></td>
                    <td th:text="${giaFormattedMap[lenh.maGD]}"></td>
                    <td th:text="${lenh.soLuong}"></td>
                    <td th:text="${mapSoLuongKhop[lenh.maGD]}"></td>
                    <td th:text="${mapGiaKhop[lenh.maGD]}"></td>
                    <td th:text="${mapNgayKhop[lenh.maGD] != null ? #temporals.format(mapNgayKhop[lenh.maGD], 'dd/MM/yyyy HH:mm:ss') : '—'}"></td>
                    <td th:text="${#temporals.format(lenh.ngayGD, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td th:text="${lenh.trangThai}"></td>
                    <td>
                        <button class="btn-sua" th:if="${lenh.trangThai == 'Chờ'}" th:onclick="|window.location.href='/nhadautu/sua-lenh?maGD=' + [[${lenh.maGD}]]|">Sửa</button>
                        <button class="btn-huy" th:if="${lenh.trangThai == 'Chờ'}" th:onclick="|xacNhanHuy(${lenh.maGD})|">Hủy</button>
                    </td>
                </tr>
            </table>
        </div>
    </main>
</div>

<script>
    function xacNhanHuy(maGD) {
        if (confirm("Bạn có chắc chắn muốn hủy lệnh mã " + maGD + " không?")) {
            fetch(`/nhadautu/huy-lenh?maGD=${maGD}`, {
                method: 'POST'
            })
            .then(res => {
                if (res.ok) {
                    alert("Đã hủy lệnh thành công.");
                    location.reload();
                } else {
                    alert("Không thể hủy lệnh. Vui lòng thử lại sau.");
                }
            });
        }
    }

    document.getElementById("trangThai").addEventListener("change", function () {
        document.getElementById("filterForm").submit();
    });

    document.addEventListener("DOMContentLoaded", function () {
        const openButton = document.getElementById("openPasswordPopup");
        if (openButton) {
            console.log("Open button found");
            openButton.addEventListener("click", function (e) {
                e.preventDefault();
                console.log("Open button clicked");
                openPopup();
            });
        } else {
            console.error("Element #openPasswordPopup not found");
        }
    });

    window.openPopup = function () {
        const popup = document.getElementById("changePasswordPopup");
        if (popup) {
            console.log("Opening popup");
            popup.style.display = "flex";
        } else {
            console.error("Element #changePasswordPopup not found");
        }
    }

    window.closePopup = function () {
        const popup = document.getElementById("changePasswordPopup");
        if (popup) {
            console.log("Closing popup");
            popup.style.display = "none";
        } else {
            console.error("Element #changePasswordPopup not found");
        }
    }
</script>
</body>
</html>
