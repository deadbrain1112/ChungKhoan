<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sao Kê Giao Dịch</title>
    <link rel="stylesheet" th:href="@{/css/sao_ke_gdck.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body class="sao-ke">
<div class="container">
	<div th:replace="~{ndt/header :: menu(taiKhoan)}"></div>

    <main class="sao-ke-container">
        <h2>Sao Kê Giao Dịch Chứng Khoán</h2>
        
        <form id="filterForm" method="post" th:action="@{/nhadautu/sao-ke-gdck}">
		    <label for="trangThai">Lọc theo trạng thái:</label>
		    <select name="trangThai" id="trangThai">
		        <option value="">Tất cả</option>
		        <option value="Chờ" th:selected="${selectedTrangThai == 'Chờ'}">Chờ</option>
		        <option value="Hết" th:selected="${selectedTrangThai == 'Hết'}">Hết</option>
		        <option value="Hủy" th:selected="${selectedTrangThai == 'Hủy'}">Hủy</option>
		        <option value="Một phần" th:selected="${selectedTrangThai == 'Một phần'}">Một phần</option>
		    </select>
		</form>

        <div th:if="${lenhDatList != null and #lists.isEmpty(lenhDatList)}">
            <p>Không tìm thấy giao dịch nào cho nhà đầu tư.</p>
        </div>

        <div th:if="${lenhDatList != null and !#lists.isEmpty(lenhDatList)}">
            <table>
                <thead>
                    <tr>
                        <th>Mã Lệnh</th>
                        <th>Loại Lệnh</th>
                        <th>Mã Cổ Phiếu</th>
                        <th>Giá</th>
                        <th>Khối Lượng</th>
                        <th>Ngày</th>
                        <th>Giờ</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
				    <tr th:each="lenh : ${lenhDatList}">
				        <td th:text="${lenh.maGD}"></td>
				        <td th:text="${lenh.loaiLenh}"></td>
				        <td th:text="${lenh.coPhieu.maCP}"></td>
				        <td th:text="${giaFormattedMap[lenh.maGD]}"></td>
				        <td th:text="${lenh.soLuong}"></td>
				        <td th:text="${#temporals.format(lenh.ngayGD, 'dd/MM/yyyy')}"></td>
				        <td th:text="${#temporals.format(lenh.ngayGD, 'HH:mm:ss')}"></td>
				        <td th:text="${lenh.trangThai}"></td>
				        <td>
				            <button th:if="${lenh.trangThai == 'Chờ'}"
       						th:onclick="|xacNhanHuy(${lenh.maGD})|">Hủy</button>
				            <button th:if="${lenh.trangThai == 'Chờ'}" th:onclick="|window.location.href='/nhadautu/sua-lenh?maGD=' + [[${lenh.maGD}]]|">Sửa</button>
				        </td>
				    </tr>
				</tbody>
            </table>
        </div>
    </main>
</div>

<script>
    function xacNhanHuy(maGD) {
        if (confirm("Bạn có chắc chắn muốn hủy lệnh mã " + maGD + " không?")) {
            fetch(`/nhadautu/huy-lenh?maGD=${maGD}`, {
                method: 'POST'
            })
            .then(res => {
                if (res.ok) {
                    alert("Đã hủy lệnh thành công.");
                    location.reload();
                } else {
                    alert("Không thể hủy lệnh. Vui lòng thử lại sau.");
                }
            });
        }
    }
    
    document.getElementById("trangThai").addEventListener("change", function () {
        document.getElementById("filterForm").submit();
    });
    
    document.addEventListener("DOMContentLoaded", function () {
        const openButton = document.getElementById("openPasswordPopup");
        if (openButton) {
            console.log("Open button found");
            openButton.addEventListener("click", function (e) {
                e.preventDefault();
                console.log("Open button clicked");
                openPopup();
            });
        } else {
            console.error("Element #openPasswordPopup not found");
        }
    });

    // Đổi mk
    window.openPopup = function () {
        const popup = document.getElementById("changePasswordPopup");
        if (popup) {
            console.log("Opening popup");
            popup.style.display = "flex";
        } else {
            console.error("Element #changePasswordPopup not found");
        }
    }

    window.closePopup = function () {
        const popup = document.getElementById("changePasswordPopup");
        if (popup) {
            console.log("Closing popup");
            popup.style.display = "none";
        } else {
            console.error("Element #changePasswordPopup not found");
        }
    }
</script>
</body>
</html>
