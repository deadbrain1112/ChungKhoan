<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng giá cổ phiếu</title>
    <link rel="stylesheet" th:href="@{/css/stock_board.css}">
    <style>
        .green { color: green; }
        .red { color: red; }
        .yellow { color: yellow; }
        .flash {
            animation: flash 0.5s ease-in-out 2;
        }
        @keyframes flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
	<header class="top-header">
	    <div class="logo">STOCK TRADER</div>

	    <div class="auth-buttons">
	        <a th:if="${session.nhaDauTu == null}" th:href="@{/login}" class="btn-login">Đăng nhập</a>
	        <a th:if="${session.nhaDauTu == null}" th:href="@{/register}" class="btn-register">Đăng ký</a>
	        <div th:if="${session.nhaDauTu != null}" class="account-dropdown">
	            <a th:href="@{/nhadautu/home}" th:text="${session.nhaDauTu.hoTen}" class="account-link">Tài khoản</a>
	            <a th:href="@{/logout}" class="btn-logout">Đăng xuất</a>
	        </div>
	    </div>
	</header>

	<h2>BẢNG GIÁ CỔ PHIẾU TRỰC TUYẾN</h2>

	<div class="toolbar">
	    <form class="search-form" method="get" th:action="@{/stock-board}">
	        <label class="search-icon">🔍</label>
	        <input type="text" name="maCP" placeholder="Tìm kiếm CP"  autocomplete="off"/>
	    </form>

		<div th:if="${session.nhaDauTu != null}">
		    <form class="filter-form" method="get" th:action="@{/stock-board}">
		        <label for="filter">Lọc danh sách:</label>
		        <select name="filter" id="filter" onchange="this.form.submit()">
		            <option value="tatca" th:selected="${filter == 'tatca'}">Tất cả</option>
		            <option value="sohuu" th:selected="${filter == 'sohuu'}">Đã sở hữu</option>
		        </select>
		    </form>
		</div>
	</div>

<table>
    <thead>
    <tr>
        <th rowspan="2">Mã CK</th>
        <th rowspan="2">T.C</th>
        <th rowspan="2">Trần</th>
        <th rowspan="2">Sàn</th>
        <th colspan="6">Bên mua</th>
        <th colspan="3">Khớp lệnh</th>
        <th colspan="6">Bên bán</th>
        <th rowspan="2">Tổng KL</th>
    </tr>
    <tr>
        <th>Giá 3</th><th>KL 3</th>
        <th>Giá 2</th><th>KL 2</th>
        <th>Giá 1</th><th>KL 1</th>
        <th>Giá</th><th>KL</th><th>+/-</th>
        <th>Giá 1</th><th>KL 1</th>
        <th>Giá 2</th><th>KL 2</th>
        <th>Giá 3</th><th>KL 3</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="cp : ${dsCP}">
        <td th:text="${cp.maCP}"></td>

        <!-- Tham chiếu / Trần / Sàn -->
        <td class="gia-tham-chieu" th:text="${#numbers.formatDecimal(giaTCMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>
        <td class="gia-tran" th:text="${#numbers.formatDecimal(giaTranMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>
        <td class="gia-san" th:text="${#numbers.formatDecimal(giaSanMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>

        <!-- Bên mua -->
        <td th:id="'mua-gia3-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benMuaMap[cp.maCP][2].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'mua-kl3-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benMuaMap[cp.maCP][2].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <td th:id="'mua-gia2-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benMuaMap[cp.maCP][1].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'mua-kl2-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benMuaMap[cp.maCP][1].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <td th:id="'mua-gia1-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benMuaMap[cp.maCP][0].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'mua-kl1-' + ${cp.maCP}"
            th:text="${benMuaMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benMuaMap[cp.maCP][0].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <!-- Giá khớp -->
        <td th:id="'giaKhop-' + ${cp.maCP}"
            th:text="${lenhKhopMap[cp.maCP]?.giaKhop != null ? #numbers.formatDecimal(lenhKhopMap[cp.maCP].giaKhop, 0, 'POINT', 0, 'POINT') : '-'}"
            th:classappend="${colorMap[cp.maCP]} + ' flash'"></td>

        <!-- Khối lượng khớp -->
        <td th:id="'klKhop-'+ ${cp.maCP}"
            th:text="${lenhKhopMap[cp.maCP]?.soLuongKhop != null ? #numbers.formatDecimal(lenhKhopMap[cp.maCP].soLuongKhop, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <!-- +/- -->
        <td th:id="'delta-' + ${cp.maCP}"
            th:text="${deltaMap[cp.maCP] != null ? #numbers.formatDecimal(deltaMap[cp.maCP], 0, 'POINT', 0, 'POINT') : '-'}"
            th:classappend="${colorMap[cp.maCP]} + ' flash'"></td>

        <!-- Bên bán -->
        <td th:id="'ban-gia1-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benBanMap[cp.maCP][0].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'ban-kl1-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benBanMap[cp.maCP][0].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <td th:id="'ban-gia2-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benBanMap[cp.maCP][1].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'ban-kl2-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benBanMap[cp.maCP][1].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <td th:id="'ban-gia3-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benBanMap[cp.maCP][2].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
        <td th:id="'ban-kl3-' + ${cp.maCP}"
            th:text="${benBanMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benBanMap[cp.maCP][2].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

        <!-- Tổng khối lượng -->
        <td class="tong-kl" th:text="${#numbers.formatDecimal(tongKhopMap[cp.maCP], 0, 'COMMA', 0, 'COMMA')}"></td>
    </tr>
    </tbody>
</table>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let socket = new SockJS('/ws-stock');
        let stompClient = Stomp.over(socket);
        let orderBook = {};

        // Hàm lấy dữ liệu từ bảng để khởi tạo orderBook
        function initializeOrderBookFromTable() {
            const tableBody = document.querySelector('table tbody');
            if (!tableBody) return;

            const rows = Array.from(tableBody.querySelectorAll('tr'));
            rows.forEach(row => {
                const maCP = row.cells[0]?.textContent.trim();
                if (!maCP) return;

                // Khởi tạo orderBook cho mã cổ phiếu
                if (!orderBook[maCP]) {
                    orderBook[maCP] = { buy: [], sell: [] };
                }

                // Lấy dữ liệu bên mua (Giá 1, KL 1, Giá 2, KL 2, Giá 3, KL 3)
                for (let i = 1; i <= 3; i++) {
                    const priceElem = document.getElementById(`mua-gia${i}-${maCP}`);
                    const quantityElem = document.getElementById(`mua-kl${i}-${maCP}`);
                    if (priceElem && quantityElem && priceElem.textContent !== '-' && quantityElem.textContent !== '-') {
                        const gia = parseFloat(priceElem.textContent);
                        const soLuong = parseInt(quantityElem.textContent.replace(/,/g, ''));
                        if (!isNaN(gia) && !isNaN(soLuong)) {
                            orderBook[maCP].buy.push({ gia, soLuong });
                        }
                    }
                }

                // Lấy dữ liệu bên bán
                for (let i = 1; i <= 3; i++) {
                    const priceElem = document.getElementById(`ban-gia${i}-${maCP}`);
                    const quantityElem = document.getElementById(`ban-kl${i}-${maCP}`);
                    if (priceElem && quantityElem && priceElem.textContent !== '-' && quantityElem.textContent !== '-') {
                        const gia = parseFloat(priceElem.textContent);
                        const soLuong = parseInt(quantityElem.textContent.replace(/,/g, ''));
                        if (!isNaN(gia) && !isNaN(soLuong)) {
                            orderBook[maCP].sell.push({ gia, soLuong });
                        }
                    }
                }

                // Sắp xếp: mua giảm dần, bán tăng dần
                orderBook[maCP].buy.sort((a, b) => b.gia - a.gia);
                orderBook[maCP].sell.sort((a, b) => a.gia - b.gia);
            });

            console.log('Initialized orderBook:', orderBook);
        }

        stompClient.connect({}, function () {
            console.log('WebSocket connected');
            stompClient.subscribe('/topic/stock-board', function (message) {
                try {
                    const order = JSON.parse(message.body);
                    if (!order || !order.maCP) return;

                    const maCP = order.maCP.trim();
                    const isMatch = order.type === 'match';

                    // Khởi tạo orderBook cho mã cổ phiếu nếu chưa tồn tại
                    if (!orderBook[maCP]) {
                        orderBook[maCP] = { buy: [], sell: [] };
                    }

                    // Xử lý lệnh mới (không phải khớp lệnh)
                    if (!isMatch && order.loaiGD && order.gia != null && order.soLuong != null) {
                        const gia = parseFloat(order.gia) / 1000;
                        const soLuong = parseInt(order.soLuong);
                        const side = order.loaiGD === 'M' ? 'buy' : 'sell';

                        // Tìm lệnh hiện có với cùng giá
                        let existing = orderBook[maCP][side].find(o => Math.abs(o.gia - gia) < 0.001);
                        if (existing) {
                            // Cộng dồn khối lượng
                            existing.soLuong = parseInt(existing.soLuong) + soLuong;
                            if (existing.soLuong <= 0) {
                                // Xóa lệnh nếu khối lượng <= 0
                                orderBook[maCP][side] = orderBook[maCP][side].filter(o => Math.abs(o.gia - gia) >= 0.001);
                            }
                        } else {
                            // Thêm lệnh mới nếu giá chưa tồn tại
                            orderBook[maCP][side].push({ gia, soLuong });
                        }

                        // Sắp xếp danh sách: mua giảm dần, bán tăng dần
                        orderBook[maCP][side].sort((a, b) => side === 'buy' ? b.gia - a.gia : a.gia - b.gia);

                        // Cập nhật giao diện
                        updateOrderSide(maCP, side);
                    }

                    // Xử lý khớp lệnh
                    if (isMatch && order.giaKhop != null && order.soLuongKhop != null) {
                        capNhatBangGia({
                            maCP,
                            giakhop: parseFloat(order.giaKhop) / 1000,
                            soLuong: order.soLuongKhop,
                            delta: order.delta != null ? parseFloat(order.delta) / 1000 : 0
                        });

                        const soLuongKhop = parseInt(order.soLuongKhop);
                        const giaMua = parseFloat(order.giaMua) / 1000;
                        const giaBan = parseFloat(order.giaBan) / 1000;

                        if (!isNaN(giaMua)) capNhatSoLuong(maCP, 'buy', giaMua, soLuongKhop);
                        if (!isNaN(giaBan)) capNhatSoLuong(maCP, 'sell', giaBan, soLuongKhop);
                    }
                } catch (e) {
                    console.error('WebSocket error:', e);
                }
            });
        });

        function updateOrderSide(maCP, side) {
            const sideOrders = (orderBook[maCP][side] || []).slice(0, 3); // Hiển thị top 3
            for (let i = 1; i <= 3; i++) {
                const priceElem = document.getElementById(`${side === 'buy' ? 'mua' : 'ban'}-gia${i}-${maCP}`);
                const quantityElem = document.getElementById(`${side === 'buy' ? 'mua' : 'ban'}-kl${i}-${maCP}`);
                if (priceElem && quantityElem) {
                    const order = sideOrders[i - 1];
                    if (order) {
                        priceElem.textContent = order.gia.toFixed(3);
                        quantityElem.textContent = order.soLuong.toLocaleString();
                        const color = side === 'buy' ? 'green' : 'red';
                        priceElem.className = quantityElem.className = `${color} flash`;
                        setTimeout(() => {
                            priceElem.className = quantityElem.className = color;
                        }, 1000);
                    } else {
                        priceElem.textContent = quantityElem.textContent = '-';
                        priceElem.className = quantityElem.className = '';
                    }
                }
            }
        }

        function capNhatBangGia(data) {
            const { maCP, giakhop, soLuong, delta } = data;
            let giaKhopElem = document.getElementById(`giaKhop-${maCP}`);
            let klKhopElem = document.getElementById(`klKhop-${maCP}`);
            let deltaElem = document.getElementById(`delta-${maCP}`);

            if (!giaKhopElem || !klKhopElem || !deltaElem) return;

            giaKhopElem.textContent = giakhop?.toFixed(3) ?? '-';
            klKhopElem.textContent = soLuong?.toLocaleString() ?? '-';
            deltaElem.textContent = delta?.toFixed(3) ?? '-';

            const color = delta > 0 ? 'green' : delta < 0 ? 'red' : 'yellow';
            giaKhopElem.className = klKhopElem.className = deltaElem.className = `${color} flash`;
            setTimeout(() => {
                giaKhopElem.className = klKhopElem.className = deltaElem.className = color;
            }, 1000);
        }

        function capNhatSoLuong(maCP, side, giaCanTru, soLuongTru) {
            const list = orderBook[maCP]?.[side];
            if (!list) return;

            const index = list.findIndex(o => Math.abs(o.gia - giaCanTru) < 0.001);
            if (index === -1) return;

            list[index].soLuong = parseInt(list[index].soLuong) - soLuongTru;
            if (list[index].soLuong <= 0) {
                list.splice(index, 1);
            }

            list.sort((a, b) => side === 'buy' ? b.gia - a.gia : a.gia - b.gia);
            updateOrderSide(maCP, side);
        }

        document.addEventListener('DOMContentLoaded', function () {
            // Khởi tạo orderBook từ bảng
            initializeOrderBookFromTable();

            const input = document.querySelector('input[name="maCP"]');
            const tableBody = document.querySelector('table tbody');

            if (!input || !tableBody) return;

            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const value = input.value.trim().toUpperCase();
                    const rows = Array.from(tableBody.querySelectorAll('tr'));
                    const matchingRow = rows.find(row => row.cells[0]?.textContent.trim().toUpperCase() === value);

                    if (matchingRow) {
                        tableBody.insertBefore(matchingRow, tableBody.firstChild);
                        matchingRow.classList.add('highlighted-row');
                        setTimeout(() => {
                            matchingRow.classList.remove('highlighted-row');
                        }, 3000);
                    }
                }
            });
        });
    </script>
</body>
</html>
