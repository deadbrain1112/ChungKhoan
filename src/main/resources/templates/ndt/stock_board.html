<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng giá cổ phiếu</title>
    <link rel="stylesheet" th:href="@{/css/stock_board.css}">

</head>
<body>
	<header class="top-header">
	    <div class="logo">STOCK TRADER</div>
	
	    <div class="auth-buttons">
	        <a th:if="${session.nhaDauTu == null}" th:href="@{/login}" class="btn-login">Đăng nhập</a>
	        <a th:if="${session.nhaDauTu == null}" th:href="@{/register}" class="btn-register">Đăng ký</a>
	        <div th:if="${session.nhaDauTu != null}" class="account-dropdown">
	            <a th:href="@{/nhadautu/home}" th:text="${session.nhaDauTu.hoTen}" class="account-link">Tài khoản</a>
	            <a th:href="@{/logout}" class="btn-logout">Đăng xuất</a>
	        </div>
	    </div>
	</header>

	<h2>BẢNG GIÁ CỔ PHIẾU TRỰC TUYẾN</h2>
	
	<div class="toolbar">
	    <form class="search-form" method="get" th:action="@{/stock-board}">
	        <label class="search-icon">🔍</label>
	        <input type="text" name="maCP" placeholder="Tìm kiếm CP"  autocomplete="off"/>
	    </form>
	
		<div th:if="${session.nhaDauTu != null}">
		    <form class="filter-form" method="get" th:action="@{/stock-board}">
		        <label for="filter">Lọc danh sách:</label>
		        <select name="filter" id="filter" onchange="this.form.submit()">
		            <option value="tatca" th:selected="${filter == 'tatca'}">Tất cả</option>
		            <option value="sohuu" th:selected="${filter == 'sohuu'}">Đã sở hữu</option>
		        </select>
		    </form>
		</div>
	</div>

    <table>
        <thead>
            <tr>
                <th rowspan="2">Mã CK</th>
                <th rowspan="2">T.C</th>
                <th rowspan="2">Trần</th>
                <th rowspan="2">Sàn</th>
                <th colspan="6">Bên mua</th>
                <th colspan="3">Khớp lệnh</th>
                <th colspan="6">Bên bán</th>
                <th rowspan="2">Tổng KL</th>
            </tr>
            <tr>
                <th>Giá 3</th><th>KL 3</th>
                <th>Giá 2</th><th>KL 2</th>
                <th>Giá 1</th><th>KL 1</th>
                <th>Giá</th><th>KL</th><th>+/-</th>
                <th>Giá 1</th><th>KL 1</th>
                <th>Giá 2</th><th>KL 2</th>
                <th>Giá 3</th><th>KL 3</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cp : ${dsCP}">
                <td th:text="${cp.maCP}"></td>

                <!-- Tham chiếu / Trần / Sàn -->
                <td class="gia-tham-chieu" th:text="${#numbers.formatDecimal(giaTCMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>
                <td class="gia-tran" th:text="${#numbers.formatDecimal(giaTranMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>
                <td class="gia-san" th:text="${#numbers.formatDecimal(giaSanMap[cp.maCP], 0, 'POINT', 0, 'POINT')}"></td>

                <!-- Bên mua -->
                <td th:text="${benMuaMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benMuaMap[cp.maCP][2].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benMuaMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benMuaMap[cp.maCP][2].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>
                <td th:text="${benMuaMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benMuaMap[cp.maCP][1].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benMuaMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benMuaMap[cp.maCP][1].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>
                <td th:text="${benMuaMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benMuaMap[cp.maCP][0].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benMuaMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benMuaMap[cp.maCP][0].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

                <!-- Giá khớp -->
                <td th:text="${lenhKhopMap[cp.maCP]?.giaKhop != null ? #numbers.formatDecimal(lenhKhopMap[cp.maCP].giaKhop, 0, 'POINT', 0, 'POINT') : '-'}"
                    th:classappend="${colorMap[cp.maCP]} + ' flash'">
                </td>

                <!-- Khối lượng khớp -->
                <td th:text="${lenhKhopMap[cp.maCP]?.soLuongKhop != null ? #numbers.formatDecimal(lenhKhopMap[cp.maCP].soLuongKhop, 0, 'COMMA', 0, 'COMMA') : '-'}">
                </td>

                <!-- +/- -->
                <td th:text="${deltaMap[cp.maCP] != null ? #numbers.formatDecimal(deltaMap[cp.maCP], 0, 'POINT', 0, 'POINT') : '-'}"
                    th:classappend="${colorMap[cp.maCP]} + ' flash'">
                </td>

                <!-- Bên bán -->
                <td th:text="${benBanMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benBanMap[cp.maCP][0].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benBanMap[cp.maCP]?.size() > 0 ? #numbers.formatDecimal(benBanMap[cp.maCP][0].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>
                <td th:text="${benBanMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benBanMap[cp.maCP][1].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benBanMap[cp.maCP]?.size() > 1 ? #numbers.formatDecimal(benBanMap[cp.maCP][1].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>
                <td th:text="${benBanMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benBanMap[cp.maCP][2].gia, 0, 'POINT', 0, 'POINT') : '-'}"></td>
                <td th:text="${benBanMap[cp.maCP]?.size() > 2 ? #numbers.formatDecimal(benBanMap[cp.maCP][2].soLuong, 0, 'COMMA', 0, 'COMMA') : '-'}"></td>

                <!-- Tổng khối lượng -->
                <td class="tong-kl" th:text="${#numbers.formatDecimal(tongKhopMap[cp.maCP], 0, 'COMMA', 0, 'COMMA')}"></td>
            </tr>
        </tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        const orderBook = {};

        const socket = new SockJS('/ws-stock');
        const stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {
            console.log('WebSocket connected');

            stompClient.subscribe('/topic/stock-board', function (message) {
                try {
                    const order = JSON.parse(message.body);
                    console.log('Received:', order);

                    // Kiểm tra dữ liệu hợp lệ chung
                    if (!order || !order.maCP) {
                        console.error('Invalid order:', order);
                        return;
                    }

                    const maCP = order.maCP.trim();

                    // Nếu có loaiGD thì xử lý mua/bán
                    if (order.loaiGD && order.gia != null && order.soLuong != null) {
                        const gia = parseFloat(order.gia).toFixed(2);
                        const soLuong = parseInt(order.soLuong);
                        const loaiGD = order.loaiGD;

                        if (!orderBook[maCP]) {
                            orderBook[maCP] = { buy: [], sell: [] };
                        }

                        if (loaiGD === 'M') {
                            const existing = orderBook[maCP].buy.find(o => o.gia === parseFloat(gia));
                            if (existing) {
                                existing.soLuong += soLuong;
                            } else {
                                orderBook[maCP].buy.push({ gia: parseFloat(gia), soLuong });
                            }
                            orderBook[maCP].buy.sort((a, b) => b.gia - a.gia);
                            orderBook[maCP].buy = orderBook[maCP].buy.slice(0, 3);
                            updateOrderSide(maCP, 'buy');

                        } else if (loaiGD === 'B') {
                            const existing = orderBook[maCP].sell.find(o => o.gia === parseFloat(gia));
                            if (existing) {
                                existing.soLuong += soLuong;
                            } else {
                                orderBook[maCP].sell.push({ gia: parseFloat(gia), soLuong });
                            }
                            orderBook[maCP].sell.sort((a, b) => a.gia - b.gia);
                            orderBook[maCP].sell = orderBook[maCP].sell.slice(0, 3);
                            updateOrderSide(maCP, 'sell');
                        }
                    }

                    // Nếu có thông tin khớp lệnh thì cập nhật bảng giá
                    if (order.giaKhop != null || order.soLuongKhop != null) {
                        updateStockBoard(order);
                    }

                } catch (e) {
                    console.error('Error parsing WebSocket message:', e);
                }
            });


        }, function (error) {
            console.error('WebSocket connection failed:', error);
        });

        function updateOrderSide(maCP, side) {
            const sideOrders = orderBook[maCP]?.[side] || [];
            for (let i = 1; i <= 3; i++) {
                const priceElem = document.getElementById(`${side === 'buy' ? 'mua' : 'ban'}-gia${i}-${maCP}`);
                const quantityElem = document.getElementById(`${side === 'buy' ? 'mua' : 'ban'}-kl${i}-${maCP}`);
                if (priceElem && quantityElem) {
                    if (sideOrders[i - 1]) {
                        priceElem.textContent = sideOrders[i - 1].gia.toFixed(2);
                        quantityElem.textContent = sideOrders[i - 1].soLuong.toLocaleString();
                    } else {
                        priceElem.textContent = '-';
                        quantityElem.textContent = '-';
                    }
                }
            }
        }

        function updateStockBoard(order) {
            if (!order || typeof order !== 'object' || !order.maCP) {
                console.error('Invalid order for stock board update:', order);
                return;
            }

            const maCP = order.maCP.trim();

            const giaKhop = isValidNumber(order.giaKhop) ? parseFloat(order.giaKhop).toFixed(0) : '-';
            const soLuongKhop = isValidNumber(order.soLuongKhop) ? parseInt(order.soLuongKhop).toLocaleString() : '-';
            const giaThamChieu = isValidNumber(order.giaThamChieu) ? parseFloat(order.giaThamChieu).toFixed(0) : '-';
            const giaTran = isValidNumber(order.giaTran) ? parseFloat(order.giaTran).toFixed(0) : '-';
            const giaSan = isValidNumber(order.giaSan) ? parseFloat(order.giaSan).toFixed(0) : '-';
            const chenhLech = (isValidNumber(order.giaKhop) && isValidNumber(order.giaThamChieu))
                ? (order.giaKhop - order.giaThamChieu).toFixed(0) : '-';

            const giaKhopElem = document.getElementById(`gia-${maCP}`);
            const soLuongKhopElem = document.getElementById(`kl-${maCP}`);

            if (giaKhopElem) {
                giaKhopElem.textContent = giaKhop;
                giaKhopElem.className = 'gia-khop';

                if (order.giaKhop == order.giaTran) {
                    giaKhopElem.classList.add('gia-tran');
                } else if (order.giaKhop == order.giaSan) {
                    giaKhopElem.classList.add('gia-san');
                } else if (order.giaKhop > order.giaThamChieu) {
                    giaKhopElem.classList.add('gia-tang');
                } else if (order.giaKhop < order.giaThamChieu) {
                    giaKhopElem.classList.add('gia-giam');
                } else {
                    giaKhopElem.classList.add('gia-tham-chieu');
                }
            }

            if (soLuongKhopElem) {
                soLuongKhopElem.textContent = soLuongKhop;
            }

            const row = Array.from(document.querySelectorAll('tr')).find(tr =>
                tr.querySelector('td')?.textContent.trim() === maCP
            );

            if (row) {
                const giaThamChieuElem = row.querySelector('.gia-tham-chieu');
                const giaTranElem = row.querySelector('.gia-tran');
                const giaSanElem = row.querySelector('.gia-san');
                const chenhLechElem = row.querySelector('td:last-child');

                if (giaThamChieuElem) giaThamChieuElem.textContent = giaThamChieu;
                if (giaTranElem) giaTranElem.textContent = giaTran;
                if (giaSanElem) giaSanElem.textContent = giaSan;
                if (chenhLechElem) chenhLechElem.textContent = chenhLech;
            } else {
                console.warn(`Không tìm thấy hàng chứa mã cổ phiếu ${maCP}`);
            }
        }

        function isValidNumber(val) {
            return val !== null && val !== undefined && !isNaN(val);
        }
        
        document.addEventListener('DOMContentLoaded', function () {
            const input = document.querySelector('input[name="maCP"]');
            const tableBody = document.querySelector('table tbody');

            if (!input || !tableBody) return;

            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault(); // không reload trang
                    const value = input.value.trim().toUpperCase();

                    const rows = Array.from(tableBody.querySelectorAll('tr'));
                    const matchingRow = rows.find(row => row.cells[0]?.textContent.trim().toUpperCase() === value);

                    if (matchingRow) {
                        // Đưa dòng tìm thấy lên đầu
                        tableBody.insertBefore(matchingRow, tableBody.firstChild);

                        // Highlight dòng trong 3s
                        matchingRow.classList.add('highlighted-row');

                        setTimeout(() => {
                            matchingRow.classList.remove('highlighted-row');
                        }, 3000);
                    }
                }
            });
        });

    </script>
</body>
</html>
