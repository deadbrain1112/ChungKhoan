<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Dịch Chứng Khoán</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
    <div class="container">
        <div th:replace="~{ndt/header :: menu(${taiKhoan})}"></div>
        
        <main>
            <section class="account-info">
                <h2>Tra Cứu Số Dư</h2>
                <div class="info">
                    <!-- Kiểm tra taiKhoan và soTien không null trước khi hiển thị -->
                    <p><strong>Tên chủ TK:</strong>
					    <span th:text="${taiKhoan?.nhaDauTu?.hoTen ?: 'Chưa có thông tin'}"></span>
					</p>
					
					<p><strong>Số dư hiện tại của quý khách:</strong>
					    <span class="highlight" th:text="${formattedSoTien}"></span> VND
					</p>
					
					<p><strong>Mã Số Tài Khoản:</strong>
					    <span th:text="${taiKhoan?.maTK ?: 'Chưa có thông tin'}"></span>
					</p>
					
					<form th:action="@{/nhadautu/home}" method="get">
					    <label><strong>Ngân Hàng:</strong></label>
					    <select name="maTK" onchange="this.form.submit()">
					        <option th:each="tk : ${danhSachTaiKhoan}"
					                th:value="${tk.maTK}"
					                th:text="${tk.nganHang.tenNH + ' - ' + tk.maTK}"
					                th:selected="${tk.maTK == taiKhoan?.maTK}">
					        </option>
					    </select>
					</form>
					
					<p th:if="${taiKhoan == null}" class="warning">Không có tài khoản được chọn hoặc tài khoản không tồn tại!</p>
			
					<p><strong>Số dư còn lại được phép giao dịch:</strong>
					    <span class="highlight" th:text="${formattedSoTien}"></span> VND
					</p>
                </div>
            </section>

            <!-- Phần cổ phiếu có thể hiển thị dữ liệu hoặc thông báo không có dữ liệu -->
            <section class="stock-balance">
                <h2>Số Dư Cổ Phiếu</h2>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Mã CP</th>
                            <th>Số lượng</th>
                            <th>Giá thị trường</th>
                            <th>Tổng giá trị</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Nếu danh sách cổ phiếu trống -->
                        <tr th:if="${danhSachCoPhieu.isEmpty()}">
                            <td colspan="4" style="text-align: center;" th:text="${nullCP}"></td>
                        </tr>

                        <!-- Hiển thị danh sách cổ phiếu -->
                        <tr th:each="soHuu : ${danhSachCoPhieu}">
                            <td th:text="${soHuu.maCP}"></td>
                            <td th:text="${soHuu.soLuong}"></td>
                            <td th:text="${giaThiTruongMap[soHuu.maCP]}"></td>
                            <td th:text="${tongGiaTriMap[soHuu.maCP]}"></td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>    
<script>
document.addEventListener("DOMContentLoaded", function () {
    const openButton = document.getElementById("openPasswordPopup");
    if (openButton) {
        console.log("Open button found");
        openButton.addEventListener("click", function (e) {
            e.preventDefault();
            console.log("Open button clicked");
            openPopup();
        });
    } else {
        console.error("Element #openPasswordPopup not found");
    }
});

window.openPopup = function () {
    const popup = document.getElementById("changePasswordPopup");
    if (popup) {
        console.log("Opening popup");
        popup.style.display = "flex";
    } else {
        console.error("Element #changePasswordPopup not found");
    }
}

window.closePopup = function () {
    const popup = document.getElementById("changePasswordPopup");
    if (popup) {
        console.log("Closing popup");
        popup.style.display = "none";
    } else {
        console.error("Element #changePasswordPopup not found");
    }
}
</script>        
</body>
</html>
